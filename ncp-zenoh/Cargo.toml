[package]
name = "ncp-zenoh"
description = "Unreleased NCP stable-1.0 Zenoh JSON/QoS adapter. Production peer-identity binding remains unavailable."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["zenoh", "neurorobotics", "protocol", "transport", "robotics"]
categories = ["network-programming", "science::robotics", "simulation"]
readme = "README.md"
documentation = "https://docs.rs/ncp-zenoh"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
ncp-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Latest stable Zenoh. Default features pull a heavy plugin chain we don't need;
# instead enable exactly the transport links NCP uses — TCP/UDP, TLS for the
# documented authenticated deployment, plus same-host shared-memory. Do not enable
# Zenoh defaults or transport_compression. The workspace root patches only
# zenoh-transport 1.9.0 to the reviewed immutable revision that selects fixed
# lz4_flex 0.11.6. Cargo feature unification is additive, so downstreams that
# enable either feature are outside this candidate's reviewed dependency profile.
zenoh = { version = "1.9", default-features = false, features = [
    "transport_tcp",
    "transport_tls",
    "transport_udp",
    "shared-memory",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }

[features]
default = []
