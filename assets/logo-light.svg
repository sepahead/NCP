<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-labelledby="ncp-mark-title ncp-mark-desc">
  <title id="ncp-mark-title">NCP paired contract rails</title>
  <desc id="ncp-mark-desc">Two independent, opposed contract rails frame separate amber request and blue outcome paths. The open center represents an interface, not a central runtime. A graphite disc and brushed metal rim match the project family.</desc>
  <defs>
    <radialGradient id="ncp-seat" cx="36%" cy="28%" r="82%">
      <stop stop-color="#22313c"/><stop offset=".5" stop-color="#111d27"/><stop offset="1" stop-color="#060c13"/>
    </radialGradient>
    <linearGradient id="ncp-rim" x1="35" y1="26" x2="147" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#314550"/><stop offset=".17" stop-color="#adbac0"/><stop offset=".34" stop-color="#526d79"/><stop offset=".52" stop-color="#253743"/><stop offset=".7" stop-color="#819294"/><stop offset=".86" stop-color="#354a56"/><stop offset="1" stop-color="#81918e"/>
    </linearGradient>
    <linearGradient id="ncp-amber" x1="42" y1="47" x2="108" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2dfae"/><stop offset=".28" stop-color="#c6a367"/><stop offset=".55" stop-color="#81613a"/><stop offset=".8" stop-color="#b08a4d"/><stop offset="1" stop-color="#55442d"/>
    </linearGradient>
    <linearGradient id="ncp-blue" x1="74" y1="46" x2="138" y2="133" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bed4d9"/><stop offset=".25" stop-color="#83b6c4"/><stop offset=".53" stop-color="#3b778b"/><stop offset=".79" stop-color="#6799a5"/><stop offset="1" stop-color="#254653"/>
    </linearGradient>
    <linearGradient id="ncp-edge" x1="32" y1="39" x2="136" y2="139" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e3e9e7" stop-opacity=".8"/><stop offset=".45" stop-color="#b0c1c5" stop-opacity=".25"/><stop offset="1" stop-color="#14242d" stop-opacity=".5"/>
    </linearGradient>
  </defs>
  <style>
    .ncp-request-light { animation: ncp-request-light 8s ease-in-out infinite; }
    .ncp-outcome-light { animation: ncp-outcome-light 8s ease-in-out infinite; }
    @keyframes ncp-request-light { 0%, 48%, 100% { opacity: .4; } 20%, 30% { opacity: 1; } }
    @keyframes ncp-outcome-light { 0%, 42%, 100% { opacity: .4; } 66%, 76% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .ncp-request-light, .ncp-outcome-light { animation: none; }
    }
  </style>
  <g id="ncp-housing" fill="none">
    <circle cx="90" cy="90" r="68" fill="url(#ncp-seat)" stroke="#070c12" stroke-width="5"/>
    <circle cx="90" cy="90" r="68" stroke="url(#ncp-rim)" stroke-width="3.2"/>
    <circle cx="90" cy="90" r="63.8" stroke="#8cabb7" stroke-opacity=".18" stroke-width=".65"/>
    <path d="M76 22H104 M76 158H104" stroke="#080f16" stroke-width="5.4"/>
    <path d="M82 22H98 M82 158H98" stroke="url(#ncp-rim)" stroke-width="1.2"/>
    <path d="M27 63 30 64 M24 72 28 73 M24 108 28 107 M27 117 30 116 M153 63 150 64 M156 72 152 73 M156 108 152 107 M153 117 150 116" stroke="#6c8590" stroke-width="1.1" stroke-opacity=".6"/>
  </g>
  <g id="ncp-contract-rails" stroke-linejoin="bevel">
    <path d="M81 48H64L43 69V111L64 132H81V121H69L55 107V73L69 59H81Z" fill="#070e16" stroke="#070e16" stroke-width="5" transform="translate(0 2)"/>
    <path d="M99 48H116L137 69V111L116 132H99V121H111L125 107V73L111 59H99Z" fill="#070e16" stroke="#070e16" stroke-width="5" transform="translate(0 2)"/>
    <path d="M81 48H64L43 69V111L64 132H81V121H69L55 107V73L69 59H81Z" fill="url(#ncp-amber)" stroke="url(#ncp-edge)" stroke-width=".85"/>
    <path d="M99 48H116L137 69V111L116 132H99V121H111L125 107V73L111 59H99Z" fill="url(#ncp-blue)" stroke="url(#ncp-edge)" stroke-width=".85"/>
    <path d="M78 51H65L47 70V109" fill="none" stroke="#ead8ab" stroke-opacity=".48" stroke-width="1"/>
    <path d="M102 51H115L133 70V109" fill="none" stroke="#c2e1e7" stroke-opacity=".55" stroke-width="1"/>
    <path d="M59 76H82L92 66H112" fill="none" stroke="#151a1e" stroke-width="5"/>
    <path d="M59 76H82L92 66H112" fill="none" stroke="url(#ncp-amber)" stroke-width="2.8"/>
    <path d="M121 104H98L88 114H68" fill="none" stroke="#101b24" stroke-width="5"/>
    <path d="M121 104H98L88 114H68" fill="none" stroke="url(#ncp-blue)" stroke-width="2.8"/>
  </g>
  <g id="ncp-path-identities">
    <path d="M104 62 108 66 104 70" fill="none" stroke="#eccea0" stroke-width="1.6"/>
    <path d="M76 110 72 114 76 118" fill="none" stroke="#97c5d1" stroke-width="1.6"/>
    <path d="M66 71 71 76 66 81 61 76Z" fill="#1c2326" stroke="#e4bd77" stroke-width="1.2"/>
    <path d="M66 73 69 76 66 79 63 76Z" fill="#f1d395" class="ncp-request-light"/>
    <rect x="108.5" y="99.5" width="9" height="9" rx="1" fill="#10212c" stroke="#8fbccc" stroke-width="1.2"/>
    <path d="M111 106V102H115" fill="none" stroke="#c3e6ec" stroke-width="1.2" class="ncp-outcome-light"/>
  </g>
</svg>
