    <circle cx="250" cy="256" r="1.35" class="gate-kernel-hot" />

    <polygon points="277,244.9 279.1,247 277,249.1 274.9,247" class="gate-packet gate-packet-perception" filter="url(#edgeGlow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-15 0;-15 0;-37 0;-54 0" keyTimes="0;0.28;0.40;0.70;1" dur="7.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0.55;1;1;0" keyTimes="0;0.04;0.24;0.40;0.72;0.96;1" dur="7.2s" repeatCount="indefinite" />
    </polygon>
    <polygon points="223,262.7 225.3,265 223,267.3 220.7,265" class="gate-packet gate-packet-action" filter="url(#edgeGlow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;15 0;15 0;37 0;54 0" keyTimes="0;0.34;0.56;0.72;1" dur="7.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0.42;1;1;0" keyTimes="0;0.04;0.30;0.56;0.74;0.96;1" dur="7.2s" repeatCount="indefinite" />
    </polygon>
    <circle cx="250" cy="256" r="8.2" class="gate-admit" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.50;0.58;0.68;1" dur="7.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="8.2;8.2;10.8;12.5;12.5" keyTimes="0;0.50;0.58;0.68;1" dur="7.2s" repeatCount="indefinite" />
