# Rust comparison arms of benchmarks/comparison: a raw pipe floor, gRPC (tonic), and Zenoh.
# Kept outside the ncp crate so that the protocol stays lean.
[package]
name = "ncp-comparison-bench"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
bytes = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
serde_json = "=1.0.154"
# The SHA-256 implementation of the NCP 2 Rust SDK, for the arms with the same integrity check.
sha2 = "=0.11.1"
tokio = { version = "1", features = ["rt", "net", "macros", "time"] }
tonic = "0.14"
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
zenoh = { version = "=1.10.1", default-features = false, features = ["transport_tcp"] }

[profile.release]
codegen-units = 1

[workspace]
