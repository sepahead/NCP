[package]
name = "sepahead-ncp-zenoh"
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "The Zenoh binding of NCP 2: exchanges as Zenoh queries and replies, streams as publications"
repository = "https://github.com/sepahead/NCP"
readme = "README.md"
keywords = ["co-simulation", "protocol", "exactly-once", "zenoh"]
categories = ["network-programming", "science"]
# The tests need files from the rest of the repository; they run there, not from the package.
exclude = ["tests/"]

[lib]
name = "ncp_zenoh"

[dependencies]
sepahead-ncp-core = { path = "../../../rust", version = "=2.0.0" }
serde_json = "=1.0.154"
# TCP and TLS links only: no QUIC, no shared memory, no compression.
zenoh = { version = "=1.10.2", default-features = false, features = ["transport_tcp", "transport_tls"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }

[[example]]
name = "zenoh_echo_owner"

# Its own workspace and lockfile: the NCP 2 core crate keeps its four dependencies.
[workspace]
