<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="873" viewBox="0 0 1600 873" role="img" aria-labelledby="payload-transfer-title payload-transfer-desc">
<title id="payload-transfer-title">NCP bounded payload transfer</title>
<desc id="payload-transfer-desc">A receiver reserves the complete declared length, admits only the next verified chunk, and seals the payload after the complete SHA-256 digest matches. Chunks are at most 32,768 bytes and payloads at most 8,388,608 bytes. The SDK is UNRELEASED. It is not release or certification evidence.</desc>
