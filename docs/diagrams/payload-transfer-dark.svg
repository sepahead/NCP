<text x="1407.5" y="43.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">IMPLEMENTED SDK</text>
<text x="52" y="46" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">PAYLOAD TRANSFER</text>
<text x="52" y="114" class="s" font-size="38" fill="#8DB2D8" font-weight="700">Reserve first, then admit verified chunks in order</text>
<text x="78" y="212" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Producer buffer</text>
<text x="78" y="244" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Sealed, owned bytes</text>
<text x="78" y="302" class="r" font-size="25" fill="#ECE5D5">The byte manifest binds the</text>
<text x="78" y="335" class="r" font-size="25" fill="#ECE5D5">length, the payload SHA-256,</text>
<text x="78" y="368" class="r" font-size="25" fill="#ECE5D5">and the semantic digest.</text>
<text x="1174" y="212" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Receiver import</text>
<text x="1174" y="244" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Reserve, admit, seal</text>
<text x="1174" y="302" class="r" font-size="25" fill="#ECE5D5">Reserve the full length first.</text>
<text x="1174" y="335" class="r" font-size="25" fill="#ECE5D5">Seal only when the complete</text>
<text x="1174" y="368" class="r" font-size="25" fill="#ECE5D5">SHA-256 matches.</text>
<text x="536" y="232" class="s" font-size="25" fill="#AAB7BE" font-weight="600">chunks in index order</text>
<text x="583.2" y="295" class="s" font-size="25" fill="#ECE5D5" font-weight="700" text-anchor="middle">0</text>
<text x="691.6" y="295" class="s" font-size="25" fill="#ECE5D5" font-weight="700" text-anchor="middle">1</text>
<text x="800" y="295" class="s" font-size="25" fill="#ECE5D5" font-weight="700" text-anchor="middle">2</text>
<text x="908.4" y="295" class="s" font-size="25" fill="#ECE5D5" font-weight="700" text-anchor="middle">…</text>
<text x="1016.8" y="295" class="s" font-size="25" fill="#ECE5D5" font-weight="700" text-anchor="middle">last</text>
<text x="90" y="489.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">1</text>
<text x="122" y="490" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Each chunk</text>
<text x="78" y="548" class="r" font-size="25" fill="#ECE5D5">Index, offset, decoded length,</text>
<text x="78" y="581" class="r" font-size="25" fill="#ECE5D5">canonical base64, and chunk SHA-256</text>
<text x="78" y="614" class="r" font-size="25" fill="#ECE5D5">must match.</text>
<text x="599.3" y="489.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">2</text>
<text x="631.3" y="490" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Seal</text>
<text x="587.3" y="548" class="r" font-size="25" fill="#ECE5D5">The complete payload SHA-256 must</text>
<text x="587.3" y="581" class="r" font-size="25" fill="#ECE5D5">match. Valid chunk digests cannot</text>
<text x="587.3" y="614" class="r" font-size="25" fill="#ECE5D5">replace it.</text>
<text x="1108.7" y="489.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">3</text>
<text x="1140.7" y="490" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Chunk count</text>
<text x="1096.7" y="548" class="r" font-size="25" fill="#ECE5D5">The count is the length divided by</text>
<text x="1096.7" y="581" class="r" font-size="25" fill="#ECE5D5">32,768 bytes, rounded up. A payload</text>
<text x="1096.7" y="614" class="r" font-size="25" fill="#ECE5D5">of at most 8,388,608 bytes needs at</text>
<text x="1096.7" y="647" class="r" font-size="25" fill="#ECE5D5">most 256 chunks.</text>
<text x="84" y="741" class="s" font-size="24" fill="#AAB7BE" font-weight="600">LIFETIMES</text>
<text x="84" y="779" class="r" font-size="25" fill="#ECE5D5">An acknowledgement releases the result frame only. Buffer release and import abort are separate operations on one exact named</text>
<text x="84" y="812" class="r" font-size="25" fill="#ECE5D5">entry. A failed admission keeps counters, reservations, and stored bytes unchanged.</text>
</svg>
