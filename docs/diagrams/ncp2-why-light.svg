<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1027" viewBox="0 0 1600 1027" role="img" aria-labelledby="ncp2-why-title ncp2-why-desc">
<title id="ncp2-why-title">Why NCP 2 exists: built-in guarantees and fast calls</title>
<desc id="ncp2-why-desc">A table compares NCP 2 with gRPC, ZeroMQ, Zenoh, and HTTP/1.1. NCP 2 builds in four guarantees that the others do not, and has the fastest small call in Rust and Python. NCP 2 is UNRELEASED. It is not release or certification evidence.</desc>
