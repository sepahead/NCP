<text x="52" y="46" class="s" font-size="24" fill="#4D5C64" font-weight="700" letter-spacing="2">WHY NCP 2</text>
<text x="52" y="114" class="s" font-size="38" fill="#1F3F60" font-weight="700">Guarantees built in, and the fastest small call</text>
<text x="52" y="166" class="r" font-size="25" fill="#2C3E50">A closed loop needs each step to run once, a clear answer after a failure, checked messages, and a record that can be checked. Other</text>
<text x="52" y="199" class="r" font-size="25" fill="#2C3E50">tools can add these on top; NCP 2 has them built in.</text>
<text x="66" y="322" class="s" font-size="24" fill="#1F3F60" font-weight="700">System</text>
<text x="262" y="308" class="s" font-size="24" fill="#1F3F60" font-weight="700">Runs each request</text>
<text x="262" y="336" class="s" font-size="24" fill="#1F3F60" font-weight="700">at most once</text>
<text x="512" y="308" class="s" font-size="24" fill="#1F3F60" font-weight="700">Says after a failure</text>
<text x="512" y="336" class="s" font-size="24" fill="#1F3F60" font-weight="700">whether it ran</text>
<text x="762" y="294" class="s" font-size="24" fill="#1F3F60" font-weight="700">SHA-256</text>
<text x="762" y="322" class="s" font-size="24" fill="#1F3F60" font-weight="700">fingerprint on each</text>
<text x="762" y="350" class="s" font-size="24" fill="#1F3F60" font-weight="700">message</text>
<text x="1012" y="308" class="s" font-size="24" fill="#1F3F60" font-weight="700">Session record a</text>
<text x="1012" y="336" class="s" font-size="24" fill="#1F3F60" font-weight="700">verifier checks</text>
<text x="1262" y="308" class="s" font-size="24" fill="#1F3F60" font-weight="700">Small call,</text>
<text x="1262" y="336" class="s" font-size="24" fill="#1F3F60" font-weight="700">Rust · Python</text>
<text x="66" y="421" class="s" font-size="25" fill="#1F3F60" font-weight="700">NCP 2</text>
<text x="262" y="421" class="s" font-size="25" fill="#1F6968" font-weight="700">Built in</text>
<text x="512" y="421" class="s" font-size="25" fill="#1F6968" font-weight="700">Built in</text>
<text x="762" y="421" class="s" font-size="25" fill="#1F6968" font-weight="700">Built in</text>
<text x="1012" y="421" class="s" font-size="25" fill="#1F6968" font-weight="700">Built in</text>
<text x="1262" y="421" class="s" font-size="25" fill="#2C3E50" font-weight="600">9.0 µs · 38.8 µs</text>
<text x="66" y="491" class="s" font-size="25" fill="#2C3E50" font-weight="600">gRPC</text>
<text x="262" y="491" class="s" font-size="25" fill="#4D5C64" font-weight="600">Not built in</text>
<text x="512" y="491" class="s" font-size="25" fill="#4D5C64" font-weight="600">Not built in</text>
<text x="762" y="491" class="s" font-size="25" fill="#4D5C64" font-weight="600">Not built in</text>
<text x="1012" y="491" class="s" font-size="25" fill="#4D5C64" font-weight="600">Not built in</text>
<text x="1262" y="491" class="s" font-size="25" fill="#2C3E50" font-weight="600">35.9 µs · 114.5 µs</text>
<text x="66" y="561" class="s" font-size="25" fill="#2C3E50" font-weight="600">ZeroMQ</text>
<text x="262" y="561" class="s" font-size="25" fill="#4D5C64" font-weight="600">Not built in</text>
<text x="512" y="561" class="s" font-size="25" fill="#4D5C64" font-weight="600">Not built in</text>
<text x="762" y="561" class="s" font-size="25" fill="#4D5C64" font-weight="600">Not built in</text>
<text x="1012" y="561" class="s" font-size="25" fill="#4D5C64" font-weight="600">Not built in</text>
<text x="1262" y="561" class="s" font-size="25" fill="#2C3E50" font-weight="600">not measured · 54.6 µs</text>
<text x="66" y="631" class="s" font-size="25" fill="#2C3E50" font-weight="600">Zenoh</text>
<text x="262" y="631" class="s" font-size="25" fill="#4D5C64" font-weight="600">Not built in</text>
<text x="512" y="631" class="s" font-size="25" fill="#4D5C64" font-weight="600">Not built in</text>
<text x="762" y="631" class="s" font-size="25" fill="#4D5C64" font-weight="600">Not built in</text>
<text x="1012" y="631" class="s" font-size="25" fill="#4D5C64" font-weight="600">Not built in</text>
<text x="1262" y="631" class="s" font-size="25" fill="#2C3E50" font-weight="600">59.5 µs · 65.2 µs</text>
<text x="66" y="701" class="s" font-size="25" fill="#2C3E50" font-weight="600">HTTP/1.1</text>
<text x="262" y="701" class="s" font-size="25" fill="#4D5C64" font-weight="600">Not built in</text>
<text x="512" y="701" class="s" font-size="25" fill="#4D5C64" font-weight="600">Not built in</text>
<text x="762" y="701" class="s" font-size="25" fill="#4D5C64" font-weight="600">Not built in</text>
<text x="1012" y="701" class="s" font-size="25" fill="#4D5C64" font-weight="600">Not built in</text>
<text x="1262" y="701" class="s" font-size="25" fill="#2C3E50" font-weight="600">not measured · 80.3 µs</text>
<text x="84" y="796" class="s" font-size="24" fill="#4D5C64" font-weight="600">HOW TO READ IT</text>
<text x="84" y="834" class="r" font-size="25" fill="#2C3E50">Medians of the comparison benchmark on one laptop, with no spikes: NCP 2 over a pipe, gRPC over a Unix socket, ZeroMQ over</text>
<text x="84" y="867" class="r" font-size="25" fill="#2C3E50">ipc, Zenoh and HTTP/1.1 over TCP. With the same SHA-256 check added to every system, NCP 2 was the fastest at every size</text>
<text x="84" y="900" class="r" font-size="25" fill="#2C3E50">up to 1 MiB.</text>
<text x="84" y="933" class="r" font-size="25" fill="#2C3E50">MUSIC, with which NEST exchanges spikes with other simulators, needs all of them in one MPI job; in this NEST build it</text>
<text x="84" y="966" class="r" font-size="25" fill="#2C3E50">delivered exact spikes only with one NEST thread.</text>
</svg>
