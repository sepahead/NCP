<text x="1406.1" y="43.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">PROPOSED DESIGN</text>
<text x="52" y="46" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">PLANE QUEUE</text>
<text x="52" y="114" class="s" font-size="38" fill="#8DB2D8" font-weight="700">Each queue limits both items and bytes</text>
<text x="78" y="246" class="s" font-size="28" fill="#ECE5D5" font-weight="700">New item</text>
<text x="78" y="278" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Size in bytes</text>
<text x="78" y="336" class="r" font-size="25" fill="#ECE5D5">The policy examines the</text>
<text x="78" y="369" class="r" font-size="25" fill="#ECE5D5">item before it retains</text>
<text x="78" y="402" class="r" font-size="25" fill="#ECE5D5">any byte.</text>
<text x="488" y="246" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Plane queue</text>
<text x="488" y="278" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Item limit and byte limit</text>
<text x="1128" y="246" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Admission</text>
<text x="1128" y="304" class="r" font-size="25" fill="#ECE5D5">Admit in one atomic step.</text>
<text x="1128" y="337" class="r" font-size="25" fill="#ECE5D5">Otherwise reject.</text>
<text x="1128" y="370" class="r" font-size="25" fill="#ECE5D5">The queue stays unchanged.</text>
<text x="90" y="527.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">1</text>
<text x="122" y="528" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Count</text>
<text x="78" y="586" class="r" font-size="25" fill="#ECE5D5">After the victims leave, one more item</text>
<text x="78" y="619" class="r" font-size="25" fill="#ECE5D5">must fit the item limit.</text>
<text x="599.3" y="527.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">2</text>
<text x="631.3" y="528" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Bytes</text>
<text x="587.3" y="586" class="r" font-size="25" fill="#ECE5D5">After the victim bytes leave, the new</text>
<text x="587.3" y="619" class="r" font-size="25" fill="#ECE5D5">bytes must fit the byte limit.</text>
<text x="1108.7" y="527.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">3</text>
<text x="1140.7" y="528" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Visible loss</text>
<text x="1096.7" y="586" class="r" font-size="25" fill="#ECE5D5">The loss count plus the victims must</text>
<text x="1096.7" y="619" class="r" font-size="25" fill="#ECE5D5">fit the loss limit.</text>
<text x="78" y="735" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Victim policy by plane</text>
<text x="78" y="793" class="r" font-size="25" fill="#ECE5D5">Control and extension: select no victim and reject when full.</text>
<text x="78" y="826" class="r" font-size="25" fill="#ECE5D5">Perception: replace the latest replaceable item.</text>
<text x="78" y="859" class="r" font-size="25" fill="#ECE5D5">Observation: drop the oldest items and count each gap.</text>
<text x="78" y="892" class="r" font-size="25" fill="#ECE5D5">Action: displace only work that the severity order permits.</text>
<text x="84" y="986" class="s" font-size="24" fill="#AAB7BE" font-weight="600">ISOLATION</text>
<text x="84" y="1024" class="r" font-size="25" fill="#ECE5D5">No plane borrows the count, byte, or local charge of another plane. Observation pressure cannot consume reserved action</text>
<text x="84" y="1057" class="r" font-size="25" fill="#ECE5D5">capacity.</text>
</svg>
