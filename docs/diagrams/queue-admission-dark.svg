<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1118" viewBox="0 0 1600 1118" role="img" aria-labelledby="queue-admission-title queue-admission-desc">
<title id="queue-admission-title">NCP finite plane queue admission</title>
<desc id="queue-admission-desc">Each plane queue limits both item count and retained bytes. A plane policy selects allowed victims or rejects. One atomic owner step records the loss, removes victims, and installs the item. This is proposed design for the UNRELEASED 1.0 candidate. It is not release or certification evidence.</desc>
