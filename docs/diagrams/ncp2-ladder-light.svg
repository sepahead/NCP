<text x="1458.6" y="43.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">REVISION 6</text>
<text x="52" y="46" class="s" font-size="24" fill="#4D5C64" font-weight="700" letter-spacing="2">NCP 2 OWNER RULES</text>
<text x="52" y="114" class="s" font-size="38" fill="#1F3F60" font-weight="700">A frame leaves at the first check that fails</text>
<text x="122" y="180" class="s" font-size="25" fill="#2C3E50" font-weight="600">possibly executed</text>
<text x="452.8" y="180" class="s" font-size="25" fill="#2C3E50" font-weight="600">not executed</text>
<text x="721" y="180" class="s" font-size="25" fill="#2C3E50" font-weight="600">two answers</text>
<text x="92" y="255.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">1</text>
<text x="130" y="256" class="s" font-size="26" fill="#2C3E50" font-weight="700">Is the frame bad?</text>
<text x="750" y="256" class="s" font-size="25" fill="#2C3E50" font-weight="600">byte stream: ended: bad_frame; Zenoh: no answer</text>
<text x="92" y="351.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">2</text>
<text x="130" y="352" class="s" font-size="26" fill="#2C3E50" font-weight="700">Is ncp not 2?</text>
<text x="750" y="352" class="s" font-size="25" fill="#2C3E50" font-weight="600">rejected: wrong_protocol</text>
<text x="92" y="464.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">3</text>
<text x="130" y="465" class="s" font-size="26" fill="#2C3E50" font-weight="700">Does the owner hold no session?</text>
<text x="750" y="446" class="s" font-size="25" fill="#2C3E50" font-weight="600">open with seq 0: start a session (section 7.1)</text>
<text x="750" y="480" class="s" font-size="25" fill="#2C3E50" font-weight="600">otherwise rejected: not_open; ended: session_expired</text>
<text x="92" y="577.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">4</text>
<text x="130" y="578" class="s" font-size="26" fill="#2C3E50" font-weight="700">Is it another session?</text>
<text x="750" y="578" class="s" font-size="25" fill="#2C3E50" font-weight="600">rejected: wrong_session</text>
<text x="92" y="690.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">5</text>
<text x="130" y="691" class="s" font-size="26" fill="#2C3E50" font-weight="700">Is seq equal to high?</text>
<text x="750" y="672" class="s" font-size="25" fill="#2C3E50" font-weight="600">the same request: the kept response again</text>
<text x="750" y="706" class="s" font-size="25" fill="#2C3E50" font-weight="600">another request: rejected: seq_conflict</text>
<text x="92" y="803.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">6</text>
<text x="130" y="804" class="s" font-size="26" fill="#2C3E50" font-weight="700">Is seq below high?</text>
<text x="750" y="804" class="s" font-size="25" fill="#2C3E50" font-weight="600">rejected: seq_stale</text>
<text x="92" y="899.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">7</text>
<text x="130" y="900" class="s" font-size="26" fill="#2C3E50" font-weight="700">Is seq above high + 1?</text>
<text x="750" y="900" class="s" font-size="25" fill="#2C3E50" font-weight="600">rejected: seq_gap</text>
<text x="92" y="995.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">8</text>
<text x="130" y="996" class="s" font-size="26" fill="#2C3E50" font-weight="700">Has the session ended?</text>
<text x="750" y="996" class="s" font-size="25" fill="#2C3E50" font-weight="600">rejected: session_ended</text>
<text x="92" y="1091.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">9</text>
<text x="130" y="1092" class="s" font-size="26" fill="#2C3E50" font-weight="700">Is ack missing or wrong?</text>
<text x="750" y="1092" class="s" font-size="25" fill="#2C3E50" font-weight="600">rejected: ack_missing, ack_mismatch</text>
<text x="92" y="1187.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">10</text>
<text x="130" y="1188" class="s" font-size="26" fill="#2C3E50" font-weight="700">Is it open, or does the owner stop?</text>
<text x="750" y="1188" class="s" font-size="25" fill="#2C3E50" font-weight="600">rejected: already_open; ended: shutdown</text>
<text x="84" y="1288" class="s" font-size="25" fill="#2C3E50" font-weight="600">11   Admitted. The owner keeps every response from here on, and its answer never changes.</text>
<text x="90" y="1407.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">12</text>
<text x="122" y="1408" class="s" font-size="28" fill="#2C3E50" font-weight="700">Execute the request</text>
<text x="78" y="1466" class="r" font-size="25" fill="#2C3E50">The owner calls the application at most once. close and ncp.ping need no application, and a feature operation of an enabled feature</text>
<text x="78" y="1499" class="r" font-size="25" fill="#2C3E50">goes to its profile.</text>
<text x="94" y="1555" class="s" font-size="25" fill="#2C3E50" font-weight="600">ok: the result</text>
<text x="822" y="1555" class="s" font-size="25" fill="#2C3E50" font-weight="600">declined: unknown_op, body_invalid</text>
<text x="94" y="1609" class="s" font-size="25" fill="#2C3E50" font-weight="600">ended: result_too_large</text>
<text x="822" y="1609" class="s" font-size="25" fill="#2C3E50" font-weight="600">ended: owner_failure</text>
<text x="78" y="1668" class="s" font-size="25" fill="#2C3E50" font-weight="600">13   The owner keeps the response. After ended, or after close, the session is over.</text>
<text x="84" y="1771" class="s" font-size="24" fill="#4D5C64" font-weight="600">WHY THE ORDER MATTERS</text>
<text x="84" y="1809" class="r" font-size="25" fill="#2C3E50">A copy of the last admitted request leaves at check 5 with the kept response, so it never executes twice. Apart from an open at</text>
<text x="84" y="1842" class="r" font-size="25" fill="#2C3E50">check 3, no check before check 11 changes any state. For the client, a rejected request other than open still means possibly</text>
<text x="84" y="1875" class="r" font-size="25" fill="#2C3E50">executed: the owner can have lost the session and opened it again.</text>
</svg>
