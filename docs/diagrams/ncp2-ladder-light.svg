<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1936" viewBox="0 0 1600 1936" role="img" aria-labelledby="ncp2-ladder-title ncp2-ladder-desc">
<title id="ncp2-ladder-title">The owner's checks for one frame, in order</title>
<desc id="ncp2-ladder-desc">Thirteen checks in the order of section 7.3. A frame leaves at the first check that fails, with the outcome and code beside it. A frame that passes ten checks is admitted, and the owner keeps every answer from that point. NCP 2 is UNRELEASED. It is not release or certification evidence.</desc>
