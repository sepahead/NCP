<text x="1406.1" y="43.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">PROPOSED DESIGN</text>
<text x="52" y="46" class="s" font-size="24" fill="#4D5C64" font-weight="700" letter-spacing="2">ECOSYSTEM</text>
<text x="52" y="114" class="s" font-size="38" fill="#1F3F60" font-weight="700">Consumers depend on NCP, and NCP depends on no consumer</text>
<text x="78" y="216" class="s" font-size="28" fill="#2C3E50" font-weight="700">Engram</text>
<text x="78" y="274" class="r" font-size="25" fill="#2C3E50">1 Engram simulation responder</text>
<text x="78" y="307" class="r" font-size="25" fill="#2C3E50">2 Engram plant commander</text>
<text x="78" y="340" class="r" font-size="25" fill="#2C3E50">3 Engram Haldir-intent extension</text>
<text x="78" y="373" class="r" font-size="25" fill="#2C3E50">publisher</text>
<text x="78" y="485" class="s" font-size="28" fill="#2C3E50" font-weight="700">Haldir</text>
<text x="78" y="543" class="r" font-size="25" fill="#2C3E50">4 Haldir NCP commander</text>
<text x="78" y="576" class="r" font-size="25" fill="#2C3E50">5 Haldir Engram-intent extension receiver</text>
<text x="78" y="609" class="r" font-size="25" fill="#2C3E50">6 Haldir Galadriel-assessment receiver</text>
<text x="78" y="642" class="r" font-size="25" fill="#2C3E50">Four processes: intent receiver, assessment</text>
<text x="78" y="675" class="r" font-size="25" fill="#2C3E50">receiver, policy-state authority (not an</text>
<text x="78" y="708" class="r" font-size="25" fill="#2C3E50">NCP peer), and commander.</text>
<text x="1054" y="216" class="s" font-size="28" fill="#2C3E50" font-weight="700">Galadriel</text>
<text x="1054" y="274" class="r" font-size="25" fill="#2C3E50">7 Galadriel NCP observer</text>
<text x="1054" y="307" class="r" font-size="25" fill="#2C3E50">8 Galadriel raw-advisory publisher</text>
<text x="1054" y="419" class="s" font-size="28" fill="#2C3E50" font-weight="700">Crebain</text>
<text x="1054" y="477" class="r" font-size="25" fill="#2C3E50">9 Crebain body</text>
<text x="1054" y="510" class="r" font-size="25" fill="#2C3E50">10 Crebain Galadriel-producer surface</text>
<text x="1054" y="622" class="s" font-size="28" fill="#2C3E50" font-weight="700">Prisoma</text>
<text x="1054" y="680" class="r" font-size="25" fill="#2C3E50">11 Prisoma NCP observer</text>
<text x="688" y="216" class="s" font-size="28" fill="#2C3E50" font-weight="700">NCP</text>
<text x="688" y="248" class="s" font-size="25" fill="#1F6968" font-weight="600">Neutral provider</text>
<text x="688" y="306" class="r" font-size="25" fill="#2C3E50">Contract, bindings,</text>
<text x="688" y="339" class="r" font-size="25" fill="#2C3E50">profiles, and</text>
<text x="688" y="372" class="r" font-size="25" fill="#2C3E50">packages.</text>
<text x="688" y="405" class="r" font-size="25" fill="#2C3E50">Imports no</text>
<text x="688" y="438" class="r" font-size="25" fill="#2C3E50">consumer code.</text>
<text x="78" y="830" class="s" font-size="28" fill="#2C3E50" font-weight="700">Fleet campaign</text>
<text x="78" y="888" class="r" font-size="25" fill="#2C3E50">One composite session for 1, 2, or 3</text>
<text x="78" y="921" class="r" font-size="25" fill="#2C3E50">drones. A sensor frame holds 6N</text>
<text x="78" y="954" class="r" font-size="25" fill="#2C3E50">scalars and a command frame 3N.</text>
<text x="78" y="987" class="r" font-size="25" fill="#2C3E50">Open.</text>
<text x="587.3" y="830" class="s" font-size="28" fill="#2C3E50" font-weight="700">MUSIC</text>
<text x="587.3" y="888" class="r" font-size="25" fill="#2C3E50">MUSIC alone owns shared-clock</text>
<text x="587.3" y="921" class="r" font-size="25" fill="#2C3E50">coupling. NCP never tunnels it.</text>
<text x="1096.7" y="830" class="s" font-size="28" fill="#2C3E50" font-weight="700">Presentation</text>
<text x="1096.7" y="888" class="r" font-size="25" fill="#2C3E50">SVG is presentation only. It carries no</text>
<text x="1096.7" y="921" class="r" font-size="25" fill="#2C3E50">protocol meaning or evidence.</text>
<text x="84" y="1081" class="s" font-size="24" fill="#4D5C64" font-weight="600">QUALIFICATION</text>
<text x="84" y="1119" class="r" font-size="25" fill="#2C3E50">Each numbered role needs its own installed-artifact and live-transport receipt. All eleven are NOT RUN. pid-rs is a local library,</text>
<text x="84" y="1152" class="r" font-size="25" fill="#2C3E50">not an NCP peer.</text>
</svg>
