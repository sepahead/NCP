<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1213" viewBox="0 0 1600 1213" role="img" aria-labelledby="ecosystem-title ecosystem-desc">
<title id="ecosystem-title">NCP ecosystem dependency direction</title>
<desc id="ecosystem-desc">Consumers depend on NCP through thin role adapters. NCP imports no consumer code. Eleven role subjects need separate installed qualification, and all are NOT RUN. Integrated Haldir uses four processes. MUSIC owns shared-clock coupling. Proposed design for the UNRELEASED 1.0 candidate. It is not release or certification evidence.</desc>
