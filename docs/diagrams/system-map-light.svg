<text x="52" y="46" class="s" font-size="24" fill="#4D5C64" font-weight="700" letter-spacing="2">SYSTEM MAP</text>
<text x="52" y="114" class="s" font-size="38" fill="#1F3F60" font-weight="700">A host composes independent applications through NCP</text>
<text x="78" y="212" class="s" font-size="28" fill="#2C3E50" font-weight="700">Host application</text>
<text x="78" y="270" class="r" font-size="25" fill="#2C3E50">Selects the peers, installs their exact contracts, sets deadlines and composition budgets, and owns process lifetime.</text>
<text x="78" y="426" class="s" font-size="28" fill="#2C3E50" font-weight="700">NCP contract and SDK</text>
<text x="78" y="484" class="r" font-size="25" fill="#2C3E50">Each exchange carries one exact request and one retained outcome. Rust and Python implement the contract independently. NCP</text>
<text x="78" y="517" class="r" font-size="25" fill="#2C3E50">runs no central process.</text>
<text x="187.4" y="562.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">Exact requests</text>
<text x="450.9" y="562.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">Retained outcomes</text>
<text x="784.3" y="562.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">Digest acknowledgements</text>
<text x="1132.5" y="562.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">Bounded byte buffers</text>
<text x="818" y="337" class="s" font-size="24" fill="#4D5C64" font-weight="600">selects and installs</text>
<text x="78" y="753" class="s" font-size="28" fill="#2C3E50" font-weight="700">Engram</text>
<text x="78" y="785" class="s" font-size="25" fill="#1F6968" font-weight="600">Neural application</text>
<text x="78" y="873" class="r" font-size="25" fill="#2C3E50">Persistent NEST network,</text>
<text x="78" y="906" class="r" font-size="25" fill="#2C3E50">typed currents, and</text>
<text x="78" y="939" class="r" font-size="25" fill="#2C3E50">delayed spike-count</text>
<text x="78" y="972" class="r" font-size="25" fill="#2C3E50">readouts.</text>
<text x="460" y="753" class="s" font-size="28" fill="#2C3E50" font-weight="700">CREBAIN</text>
<text x="460" y="785" class="s" font-size="25" fill="#1F6968" font-weight="600">Bodies and sensors</text>
<text x="460" y="873" class="r" font-size="25" fill="#2C3E50">Body dynamics, sensor</text>
<text x="460" y="906" class="r" font-size="25" fill="#2C3E50">production, and native</text>
<text x="460" y="939" class="r" font-size="25" fill="#2C3E50">checkpoint state.</text>
<text x="842" y="753" class="s" font-size="28" fill="#2C3E50" font-weight="700">Prisoma</text>
<text x="842" y="785" class="s" font-size="25" fill="#1F6968" font-weight="600">Capture and</text>
<text x="842" y="815" class="s" font-size="25" fill="#1F6968" font-weight="600">experiments</text>
<text x="842" y="873" class="r" font-size="25" fill="#2C3E50">Original-byte capture,</text>
<text x="842" y="906" class="r" font-size="25" fill="#2C3E50">experiment order,</text>
<text x="842" y="939" class="r" font-size="25" fill="#2C3E50">forecasts, and labels.</text>
<text x="1224" y="753" class="s" font-size="28" fill="#2C3E50" font-weight="700">Galadriel</text>
<text x="1224" y="785" class="s" font-size="25" fill="#1F6968" font-weight="600">Consistency monitor</text>
<text x="1224" y="873" class="r" font-size="25" fill="#2C3E50">Advisory evidence or</text>
<text x="1224" y="906" class="r" font-size="25" fill="#2C3E50">abstention without</text>
<text x="1224" y="939" class="r" font-size="25" fill="#2C3E50">command authority. Its</text>
<text x="1224" y="972" class="r" font-size="25" fill="#2C3E50">modular adapter is open</text>
<text x="1224" y="1005" class="r" font-size="25" fill="#2C3E50">work.</text>
<text x="84" y="1099" class="s" font-size="24" fill="#4D5C64" font-weight="600">BOUNDARY</text>
<text x="84" y="1137" class="r" font-size="25" fill="#2C3E50">Each application stays optional. A selected composition must satisfy the contract and resource limits of every participant. A</text>
<text x="84" y="1170" class="r" font-size="25" fill="#2C3E50">missing observation never becomes a zero value.</text>
</svg>
