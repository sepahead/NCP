<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1231" viewBox="0 0 1600 1231" role="img" aria-labelledby="system-map-title system-map-desc">
<title id="system-map-title">NCP modular system map</title>
<desc id="system-map-desc">A host selects independent applications and connects each one through the NCP contract. NCP owns message identity, retained outcomes, acknowledgements, and bounded byte buffers. Each application owns its own state. The SDK is UNRELEASED. It is not release or certification evidence.</desc>
