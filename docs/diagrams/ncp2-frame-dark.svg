<text x="52" y="46" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">NCP 2 FRAME</text>
<text x="52" y="114" class="s" font-size="38" fill="#8DB2D8" font-weight="700">Every message is one frame with its own fingerprint</text>
<text x="56" y="192" class="s" font-size="24" fill="#AAB7BE" font-weight="600">byte 0</text>
<text x="175" y="258" class="s" font-size="27" fill="#10202B" font-weight="700" text-anchor="middle">Header</text>
<text x="175" y="296" class="s" font-size="24" fill="#10202B" font-weight="600" text-anchor="middle">12 bytes</text>
<text x="308" y="192" class="s" font-size="24" fill="#AAB7BE" font-weight="600">12</text>
<text x="550" y="258" class="s" font-size="27" fill="#10202B" font-weight="700" text-anchor="middle">JSON text</text>
<text x="550" y="296" class="s" font-size="24" fill="#10202B" font-weight="600" text-anchor="middle">J bytes</text>
<text x="806" y="192" class="s" font-size="24" fill="#AAB7BE" font-weight="600">12 + J</text>
<text x="1048" y="258" class="s" font-size="27" fill="#10202B" font-weight="700" text-anchor="middle">Attachments</text>
<text x="1048" y="296" class="s" font-size="24" fill="#10202B" font-weight="600" text-anchor="middle">A bytes</text>
<text x="1304" y="192" class="s" font-size="24" fill="#AAB7BE" font-weight="600">12 + J + A</text>
<text x="1424" y="258" class="s" font-size="27" fill="#10202B" font-weight="700" text-anchor="middle">Digest</text>
<text x="1424" y="296" class="s" font-size="24" fill="#10202B" font-weight="600" text-anchor="middle">32 bytes</text>
<text x="90" y="469.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">1</text>
<text x="122" y="470" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Header</text>
<text x="78" y="528" class="r" font-size="25" fill="#ECE5D5">The magic bytes NCP and</text>
<text x="78" y="561" class="r" font-size="25" fill="#ECE5D5">2, then J and A as 32-bit</text>
<text x="78" y="594" class="r" font-size="25" fill="#ECE5D5">lengths. The receiver</text>
<text x="78" y="627" class="r" font-size="25" fill="#ECE5D5">compares the frame size,</text>
<text x="78" y="660" class="r" font-size="25" fill="#ECE5D5">44 + J + A, with the</text>
<text x="78" y="693" class="r" font-size="25" fill="#ECE5D5">session's limit before it</text>
<text x="78" y="726" class="r" font-size="25" fill="#ECE5D5">reads on.</text>
<text x="472" y="469.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">2</text>
<text x="504" y="470" class="s" font-size="28" fill="#ECE5D5" font-weight="700">JSON text</text>
<text x="460" y="528" class="r" font-size="25" fill="#ECE5D5">A request names its</text>
<text x="460" y="561" class="r" font-size="25" fill="#ECE5D5">session, its number, the</text>
<text x="460" y="594" class="r" font-size="25" fill="#ECE5D5">operation, the response</text>
<text x="460" y="627" class="r" font-size="25" fill="#ECE5D5">before it, and a body. A</text>
<text x="460" y="660" class="r" font-size="25" fill="#ECE5D5">response names its request,</text>
<text x="460" y="693" class="r" font-size="25" fill="#ECE5D5">an outcome, and a code.</text>
<text x="854" y="469.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">3</text>
<text x="886" y="470" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Attachments</text>
<text x="842" y="528" class="r" font-size="25" fill="#ECE5D5">Binary arrays, such as the</text>
<text x="842" y="561" class="r" font-size="25" fill="#ECE5D5">neurons and times of</text>
<text x="842" y="594" class="r" font-size="25" fill="#ECE5D5">spikes. Each starts at a</text>
<text x="842" y="627" class="r" font-size="25" fill="#ECE5D5">multiple of 8 bytes, so a</text>
<text x="842" y="660" class="r" font-size="25" fill="#ECE5D5">program reads it in place,</text>
<text x="842" y="693" class="r" font-size="25" fill="#ECE5D5">without converting it.</text>
<text x="1236" y="469.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">4</text>
<text x="1268" y="470" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Digest</text>
<text x="1224" y="528" class="r" font-size="25" fill="#ECE5D5">SHA-256 of all bytes</text>
<text x="1224" y="561" class="r" font-size="25" fill="#ECE5D5">before it: the frame's</text>
<text x="1224" y="594" class="r" font-size="25" fill="#ECE5D5">identity. The next request</text>
<text x="1224" y="627" class="r" font-size="25" fill="#ECE5D5">acknowledges a response</text>
<text x="1224" y="660" class="r" font-size="25" fill="#ECE5D5">by naming it, and</text>
<text x="1224" y="693" class="r" font-size="25" fill="#ECE5D5">transcripts chain frames</text>
<text x="1224" y="726" class="r" font-size="25" fill="#ECE5D5">with it.</text>
<text x="84" y="820" class="s" font-size="24" fill="#AAB7BE" font-weight="600">WHY ONE FINGERPRINT</text>
<text x="84" y="858" class="r" font-size="25" fill="#ECE5D5">A changed bit anywhere in the frame gives another digest, so a receiver that compares digests never parses or runs a damaged</text>
<text x="84" y="891" class="r" font-size="25" fill="#ECE5D5">request; only on a local link may an application turn the comparison off. The client chooses the size limit when it opens the</text>
<text x="84" y="924" class="r" font-size="25" fill="#ECE5D5">session: from 64 KiB to 64 MiB, 1 MiB by default. Text and binary data travel in one frame, with no Base64 and no second</text>
<text x="84" y="957" class="r" font-size="25" fill="#ECE5D5">message.</text>
</svg>
