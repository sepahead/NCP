<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1018" viewBox="0 0 1600 1018" role="img" aria-labelledby="ncp2-frame-title ncp2-frame-desc">
<title id="ncp2-frame-title">One NCP 2 frame</title>
<desc id="ncp2-frame-desc">A frame has a 12-byte header, the JSON text, binary attachments, and a 32-byte SHA-256 digest of all bytes before it. The digest is the frame's identity; a receiver checks it before parsing. NCP 2 is UNRELEASED. It is not release or certification evidence.</desc>
<defs>
