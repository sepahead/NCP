<text x="1406.1" y="43.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">PROPOSED DESIGN</text>
<text x="52" y="46" class="s" font-size="24" fill="#4D5C64" font-weight="700" letter-spacing="2">PREPARED RUNTIME</text>
<text x="52" y="114" class="s" font-size="38" fill="#1F3F60" font-weight="700">Prepare once, then bound, decode, and admit each frame</text>
<text x="78" y="216" class="s" font-size="28" fill="#2C3E50" font-weight="700">Prepare once</text>
<text x="78" y="274" class="r" font-size="25" fill="#2C3E50">Validate the manifest, security snapshot, routes, layouts, and queue and deadline profiles. Compile immutable handles and reserve</text>
<text x="78" y="307" class="r" font-size="25" fill="#2C3E50">shared state before any publisher or callback exists.</text>
<text x="52" y="377" class="s" font-size="24" fill="#4D5C64" font-weight="600">Each later frame follows this path:</text>
<text x="90" y="460.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">1</text>
<text x="122" y="461" class="s" font-size="26" fill="#2C3E50" font-weight="700">Bound</text>
<text x="78" y="519" class="r" font-size="25" fill="#2C3E50">Check the size</text>
<text x="78" y="552" class="r" font-size="25" fill="#2C3E50">before any</text>
<text x="78" y="585" class="r" font-size="25" fill="#2C3E50">allocation.</text>
<text x="346.7" y="460.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">2</text>
<text x="378.7" y="461" class="s" font-size="26" fill="#2C3E50" font-weight="700">Verify</text>
<text x="334.7" y="519" class="r" font-size="25" fill="#2C3E50">Resolve the</text>
<text x="334.7" y="552" class="r" font-size="25" fill="#2C3E50">ingress</text>
<text x="334.7" y="585" class="r" font-size="25" fill="#2C3E50">capability.</text>
<text x="603.3" y="460.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">3</text>
<text x="635.3" y="461" class="s" font-size="26" fill="#2C3E50" font-weight="700">Decode</text>
<text x="591.3" y="519" class="r" font-size="25" fill="#2C3E50">Decode once</text>
<text x="591.3" y="552" class="r" font-size="25" fill="#2C3E50">with the</text>
<text x="591.3" y="585" class="r" font-size="25" fill="#2C3E50">prepared</text>
<text x="591.3" y="618" class="r" font-size="25" fill="#2C3E50">layout.</text>
<text x="860" y="460.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">4</text>
<text x="892" y="461" class="s" font-size="26" fill="#2C3E50" font-weight="700">Locate</text>
<text x="848" y="519" class="r" font-size="25" fill="#2C3E50">Find route,</text>
<text x="848" y="552" class="r" font-size="25" fill="#2C3E50">session, and</text>
<text x="848" y="585" class="r" font-size="25" fill="#2C3E50">position.</text>
<text x="1116.7" y="460.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">5</text>
<text x="1148.7" y="461" class="s" font-size="26" fill="#2C3E50" font-weight="700">Admit</text>
<text x="1104.7" y="519" class="r" font-size="25" fill="#2C3E50">Apply one</text>
<text x="1104.7" y="552" class="r" font-size="25" fill="#2C3E50">short owner</text>
<text x="1104.7" y="585" class="r" font-size="25" fill="#2C3E50">step.</text>
<text x="1373.3" y="460.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">6</text>
<text x="1405.3" y="461" class="s" font-size="26" fill="#2C3E50" font-weight="700">Hand off</text>
<text x="1361.3" y="519" class="r" font-size="25" fill="#2C3E50">Enqueue after</text>
<text x="1361.3" y="552" class="r" font-size="25" fill="#2C3E50">the unlock.</text>
<text x="78" y="740" class="s" font-size="28" fill="#2C3E50" font-weight="700">Outside the hot path</text>
<text x="78" y="798" class="r" font-size="25" fill="#2C3E50">Storage, backend queries, network calls, application callbacks,</text>
<text x="78" y="831" class="r" font-size="25" fill="#2C3E50">and device I/O.</text>
<text x="842" y="740" class="s" font-size="28" fill="#2C3E50" font-weight="700">Cost model</text>
<text x="842" y="798" class="r" font-size="25" fill="#2C3E50">Hot-path time is the sum of the six stage times. Each stage</text>
<text x="842" y="831" class="r" font-size="25" fill="#2C3E50">has a selected ceiling. The sum of the ceilings bounds the</text>
<text x="842" y="864" class="r" font-size="25" fill="#2C3E50">path.</text>
</svg>
