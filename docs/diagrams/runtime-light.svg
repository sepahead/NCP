<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="926" viewBox="0 0 1600 926" role="img" aria-labelledby="runtime-title runtime-desc">
<title id="runtime-title">NCP prepared runtime and hot path</title>
<desc id="runtime-desc">Preparation compiles immutable handles once. Each frame then passes six stages: bound, verify, decode once, locate, admit in one short owner step, and hand off to a finite queue. Proposed design for the UNRELEASED 1.0 candidate. Stage ceilings are targets, not measurements. It is not release or certification evidence.</desc>
