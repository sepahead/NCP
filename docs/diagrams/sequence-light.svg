<text x="1406.1" y="43.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">PROPOSED DESIGN</text>
<text x="52" y="46" class="s" font-size="24" fill="#4D5C64" font-weight="700" letter-spacing="2">SIMULATION SESSION</text>
<text x="52" y="114" class="s" font-size="38" fill="#1F3F60" font-weight="700">Steps run in position order and replies match exactly</text>
<text x="78" y="212" class="s" font-size="28" fill="#2C3E50" font-weight="700">Client</text>
<text x="78" y="244" class="s" font-size="25" fill="#1F6968" font-weight="600">Authorized simulation</text>
<text x="78" y="274" class="s" font-size="25" fill="#1F6968" font-weight="600">caller</text>
<text x="926" y="212" class="s" font-size="28" fill="#2C3E50" font-weight="700">Simulator</text>
<text x="926" y="244" class="s" font-size="25" fill="#1F6968" font-weight="600">Bounded simulation service</text>
<text x="938" y="363.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">1</text>
<text x="970" y="364" class="s" font-size="28" fill="#2C3E50" font-weight="700">Check identity</text>
<text x="926" y="422" class="r" font-size="25" fill="#2C3E50">Accept a canonical same-major wire and the exact</text>
<text x="926" y="455" class="r" font-size="25" fill="#2C3E50">stable core.</text>
<text x="938" y="550.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">2</text>
<text x="970" y="551" class="s" font-size="28" fill="#2C3E50" font-weight="700">Prepare the window</text>
<text x="926" y="609" class="r" font-size="25" fill="#2C3E50">Reserve request slots, response slots, and digest</text>
<text x="926" y="642" class="r" font-size="25" fill="#2C3E50">entries first.</text>
<text x="938" y="737.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">3</text>
<text x="970" y="738" class="s" font-size="28" fill="#2C3E50" font-weight="700">Execute in order</text>
<text x="926" y="796" class="r" font-size="25" fill="#2C3E50">Start only the next position. An unresolved call</text>
<text x="926" y="829" class="r" font-size="25" fill="#2C3E50">retires the generation.</text>
<text x="938" y="924.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">4</text>
<text x="970" y="925" class="s" font-size="28" fill="#2C3E50" font-weight="700">Match exactly</text>
<text x="926" y="983" class="r" font-size="25" fill="#2C3E50">Compare generation, position, digest, and the</text>
<text x="926" y="1016" class="r" font-size="25" fill="#2C3E50">retained request bytes.</text>
<text x="938" y="1111.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">5</text>
<text x="970" y="1112" class="s" font-size="28" fill="#2C3E50" font-weight="700">Close</text>
<text x="926" y="1170" class="r" font-size="25" fill="#2C3E50">Stop new steps, settle reserved work, and return a</text>
<text x="926" y="1203" class="r" font-size="25" fill="#2C3E50">receipt.</text>
<text x="540.5" y="338" class="s" font-size="25" fill="#2C3E50" font-weight="600" text-anchor="middle">open: version and stable core</text>
<text x="540.5" y="525" class="s" font-size="25" fill="#2C3E50" font-weight="600" text-anchor="middle">opened: generation and step window</text>
<text x="540.5" y="712" class="s" font-size="25" fill="#2C3E50" font-weight="600" text-anchor="middle">steps at positions p, p + 1, p + 2</text>
<text x="540.5" y="899" class="s" font-size="25" fill="#2C3E50" font-weight="600" text-anchor="middle">result for each position</text>
<text x="540.5" y="1086" class="s" font-size="25" fill="#2C3E50" font-weight="600" text-anchor="middle">close, then receipt</text>
<text x="84" y="1313" class="s" font-size="24" fill="#4D5C64" font-weight="600">PROVENANCE</text>
<text x="84" y="1351" class="r" font-size="25" fill="#2C3E50">Every result carries is_simulation_output = true and calibrated_posterior = false. Simulation output never becomes plant</text>
<text x="84" y="1384" class="r" font-size="25" fill="#2C3E50">authority.</text>
</svg>
