<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1445" viewBox="0 0 1600 1445" role="img" aria-labelledby="sequence-title sequence-desc">
<title id="sequence-title">NCP simulation session sequence</title>
<desc id="sequence-desc">A client opens one simulation session after the wire and stable-core check. The simulator reserves a step window, executes positions strictly in order, and matches each result by generation, position, and request digest. Proposed design for the UNRELEASED 1.0 candidate. It is not release or certification evidence.</desc>
