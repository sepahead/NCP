<text x="52" y="46" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">NCP 2 OUTCOMES</text>
<text x="52" y="114" class="s" font-size="38" fill="#8DB2D8" font-weight="700">Four outcomes, and one honest unknown</text>
<text x="78" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">ok</text>
<text x="78" y="248" class="s" font-size="25" fill="#6FC1BD" font-weight="600">It ran once</text>
<text x="78" y="306" class="r" font-size="25" fill="#ECE5D5">The owner ran the request</text>
<text x="78" y="339" class="r" font-size="25" fill="#ECE5D5">once. The body is its</text>
<text x="78" y="372" class="r" font-size="25" fill="#ECE5D5">result. The session</text>
<text x="78" y="405" class="r" font-size="25" fill="#ECE5D5">continues.</text>
<text x="460" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">declined</text>
<text x="460" y="248" class="s" font-size="25" fill="#6FC1BD" font-weight="600">It never runs</text>
<text x="460" y="306" class="r" font-size="25" fill="#ECE5D5">The owner kept the</text>
<text x="460" y="339" class="r" font-size="25" fill="#ECE5D5">request and did not run it,</text>
<text x="460" y="372" class="r" font-size="25" fill="#ECE5D5">for example a body that</text>
<text x="460" y="405" class="r" font-size="25" fill="#ECE5D5">the application finds</text>
<text x="460" y="438" class="r" font-size="25" fill="#ECE5D5">invalid. It never runs. The</text>
<text x="460" y="471" class="r" font-size="25" fill="#ECE5D5">session continues.</text>
<text x="842" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">rejected</text>
<text x="842" y="248" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Only for open</text>
<text x="842" y="306" class="r" font-size="25" fill="#ECE5D5">The owner opened no</text>
<text x="842" y="339" class="r" font-size="25" fill="#ECE5D5">session for this open, for</text>
<text x="842" y="372" class="r" font-size="25" fill="#ECE5D5">example a wrong contract.</text>
<text x="842" y="405" class="r" font-size="25" fill="#ECE5D5">For any other request, the</text>
<text x="842" y="438" class="r" font-size="25" fill="#ECE5D5">client ends the session.</text>
<text x="1224" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">ended</text>
<text x="1224" y="248" class="s" font-size="25" fill="#6FC1BD" font-weight="600">The session is over</text>
<text x="1224" y="306" class="r" font-size="25" fill="#ECE5D5">The session cannot</text>
<text x="1224" y="339" class="r" font-size="25" fill="#ECE5D5">continue. The code says</text>
<text x="1224" y="372" class="r" font-size="25" fill="#ECE5D5">whether the request ran,</text>
<text x="1224" y="405" class="r" font-size="25" fill="#ECE5D5">did not run, or possibly</text>
<text x="1224" y="438" class="r" font-size="25" fill="#ECE5D5">ran.</text>
<text x="52" y="559" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">WHEN SOMETHING GOES WRONG</text>
<text x="78" y="645" class="s" font-size="28" fill="#ECE5D5" font-weight="700">A message is</text>
<text x="78" y="677" class="s" font-size="28" fill="#ECE5D5" font-weight="700">damaged</text>
<text x="78" y="735" class="r" font-size="25" fill="#ECE5D5">The receiver computes the</text>
<text x="78" y="768" class="r" font-size="25" fill="#ECE5D5">fingerprint again and finds</text>
<text x="78" y="801" class="r" font-size="25" fill="#ECE5D5">a difference. No damaged</text>
<text x="78" y="834" class="r" font-size="25" fill="#ECE5D5">request runs.</text>
<text x="460" y="645" class="s" font-size="28" fill="#ECE5D5" font-weight="700">A message is lost</text>
<text x="460" y="735" class="r" font-size="25" fill="#ECE5D5">The client sends the same</text>
<text x="460" y="768" class="r" font-size="25" fill="#ECE5D5">request again. The owner</text>
<text x="460" y="801" class="r" font-size="25" fill="#ECE5D5">sends its kept response</text>
<text x="460" y="834" class="r" font-size="25" fill="#ECE5D5">again: the step ran once.</text>
<text x="842" y="645" class="s" font-size="28" fill="#ECE5D5" font-weight="700">A message arrives</text>
<text x="842" y="677" class="s" font-size="28" fill="#ECE5D5" font-weight="700">twice</text>
<text x="842" y="735" class="r" font-size="25" fill="#ECE5D5">The owner recognizes the</text>
<text x="842" y="768" class="r" font-size="25" fill="#ECE5D5">copy and sends its kept</text>
<text x="842" y="801" class="r" font-size="25" fill="#ECE5D5">response again. The step</text>
<text x="842" y="834" class="r" font-size="25" fill="#ECE5D5">ran once.</text>
<text x="1224" y="645" class="s" font-size="28" fill="#ECE5D5" font-weight="700">An old copy arrives</text>
<text x="1224" y="677" class="s" font-size="28" fill="#ECE5D5" font-weight="700">late</text>
<text x="1224" y="735" class="r" font-size="25" fill="#ECE5D5">The owner rejects it,</text>
<text x="1224" y="768" class="r" font-size="25" fill="#ECE5D5">because a later request</text>
<text x="1224" y="801" class="r" font-size="25" fill="#ECE5D5">already ran. Nothing runs</text>
<text x="1224" y="834" class="r" font-size="25" fill="#ECE5D5">again.</text>
<text x="78" y="944" class="s" font-size="28" fill="#ECE5D5" font-weight="700">The owner fails in a</text>
<text x="78" y="976" class="s" font-size="28" fill="#ECE5D5" font-weight="700">step</text>
<text x="78" y="1034" class="r" font-size="25" fill="#ECE5D5">It answers ended with the</text>
<text x="78" y="1067" class="r" font-size="25" fill="#ECE5D5">code owner_failure. The</text>
<text x="78" y="1100" class="r" font-size="25" fill="#ECE5D5">step possibly ran.</text>
<text x="460" y="944" class="s" font-size="28" fill="#ECE5D5" font-weight="700">The owner restarts</text>
<text x="460" y="1034" class="r" font-size="25" fill="#ECE5D5">A later request gets</text>
<text x="460" y="1067" class="r" font-size="25" fill="#ECE5D5">session_expired: it</text>
<text x="460" y="1100" class="r" font-size="25" fill="#ECE5D5">possibly ran. A new</text>
<text x="460" y="1133" class="r" font-size="25" fill="#ECE5D5">opening has a new nonce,</text>
<text x="460" y="1166" class="r" font-size="25" fill="#ECE5D5">so no old copy runs again.</text>
<text x="842" y="944" class="s" font-size="28" fill="#ECE5D5" font-weight="700">The owner stops</text>
<text x="842" y="1034" class="r" font-size="25" fill="#ECE5D5">It answers ended with the</text>
<text x="842" y="1067" class="r" font-size="25" fill="#ECE5D5">code shutdown. The</text>
<text x="842" y="1100" class="r" font-size="25" fill="#ECE5D5">request did not run, and it</text>
<text x="842" y="1133" class="r" font-size="25" fill="#ECE5D5">never will.</text>
<text x="1224" y="944" class="s" font-size="28" fill="#ECE5D5" font-weight="700">The connection</text>
<text x="1224" y="976" class="s" font-size="28" fill="#ECE5D5" font-weight="700">breaks</text>
<text x="1224" y="1034" class="r" font-size="25" fill="#ECE5D5">The session ends. The</text>
<text x="1224" y="1067" class="r" font-size="25" fill="#ECE5D5">request without a response</text>
<text x="1224" y="1100" class="r" font-size="25" fill="#ECE5D5">possibly ran.</text>
<text x="84" y="1260" class="s" font-size="24" fill="#AAB7BE" font-weight="600">POSSIBLY EXECUTED</text>
<text x="84" y="1298" class="r" font-size="25" fill="#ECE5D5">In a session, at most one call can be possibly executed, and it is always the last one. Lean proofs cover these rules for a model of</text>
<text x="84" y="1331" class="r" font-size="25" fill="#ECE5D5">the owner and the client, and an exhaustive check of the real SDKs with up to two faults, in 2.6 million states, found no false</text>
<text x="84" y="1364" class="r" font-size="25" fill="#ECE5D5">report.</text>
</svg>
