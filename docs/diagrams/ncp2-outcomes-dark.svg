<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1425" viewBox="0 0 1600 1425" role="img" aria-labelledby="ncp2-outcomes-title ncp2-outcomes-desc">
<title id="ncp2-outcomes-title">What an NCP 2 response tells the client</title>
<desc id="ncp2-outcomes-desc">Every response is ok, declined, rejected, or ended. Eight cards show what happens to damaged, lost, repeated, and late messages, after an owner failure, a restart or a stop of the owner, and when the connection breaks. At most one call is possibly executed. NCP 2 is UNRELEASED. It is not release or certification evidence.</desc>
