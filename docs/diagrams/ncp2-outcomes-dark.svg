<text x="52" y="46" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">NCP 2 OUTCOMES</text>
<text x="52" y="114" class="s" font-size="38" fill="#8DB2D8" font-weight="700">Three outcomes tell the client exactly what happened</text>
<text x="78" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">ok</text>
<text x="78" y="248" class="s" font-size="25" fill="#6FC1BD" font-weight="600">It ran once</text>
<text x="78" y="306" class="r" font-size="25" fill="#ECE5D5">The owner ran the request once. The</text>
<text x="78" y="339" class="r" font-size="25" fill="#ECE5D5">body is its result. The session</text>
<text x="78" y="372" class="r" font-size="25" fill="#ECE5D5">continues.</text>
<text x="587.3" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">rejected</text>
<text x="587.3" y="248" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Nothing ran</text>
<text x="587.3" y="306" class="r" font-size="25" fill="#ECE5D5">Nothing ran and nothing changed. A</text>
<text x="587.3" y="339" class="r" font-size="25" fill="#ECE5D5">code says why, for example a wrong</text>
<text x="587.3" y="372" class="r" font-size="25" fill="#ECE5D5">sequence number. The client can send</text>
<text x="587.3" y="405" class="r" font-size="25" fill="#ECE5D5">a corrected request.</text>
<text x="1096.7" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">ended</text>
<text x="1096.7" y="248" class="s" font-size="25" fill="#6FC1BD" font-weight="600">The session is over</text>
<text x="1096.7" y="306" class="r" font-size="25" fill="#ECE5D5">The session cannot continue. The code</text>
<text x="1096.7" y="339" class="r" font-size="25" fill="#ECE5D5">says whether the request ran or</text>
<text x="1096.7" y="372" class="r" font-size="25" fill="#ECE5D5">possibly ran. The client opens a new</text>
<text x="1096.7" y="405" class="r" font-size="25" fill="#ECE5D5">session if it needs one.</text>
<text x="52" y="493" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">WHEN SOMETHING GOES WRONG</text>
<text x="78" y="579" class="s" font-size="28" fill="#ECE5D5" font-weight="700">A message is damaged</text>
<text x="78" y="637" class="r" font-size="25" fill="#ECE5D5">The receiver computes the fingerprint</text>
<text x="78" y="670" class="r" font-size="25" fill="#ECE5D5">again and finds a difference. No</text>
<text x="78" y="703" class="r" font-size="25" fill="#ECE5D5">damaged request runs. On a pipe or a</text>
<text x="78" y="736" class="r" font-size="25" fill="#ECE5D5">socket, the session then ends.</text>
<text x="587.3" y="579" class="s" font-size="28" fill="#ECE5D5" font-weight="700">A message is lost</text>
<text x="587.3" y="637" class="r" font-size="25" fill="#ECE5D5">The client sends the same request</text>
<text x="587.3" y="670" class="r" font-size="25" fill="#ECE5D5">again. The owner sends its kept</text>
<text x="587.3" y="703" class="r" font-size="25" fill="#ECE5D5">response again: the step ran once.</text>
<text x="1096.7" y="579" class="s" font-size="28" fill="#ECE5D5" font-weight="700">A message arrives twice</text>
<text x="1096.7" y="637" class="r" font-size="25" fill="#ECE5D5">The owner recognizes the copy and</text>
<text x="1096.7" y="670" class="r" font-size="25" fill="#ECE5D5">sends its kept response again. The</text>
<text x="1096.7" y="703" class="r" font-size="25" fill="#ECE5D5">step ran once.</text>
<text x="78" y="846" class="s" font-size="28" fill="#ECE5D5" font-weight="700">An old copy arrives late</text>
<text x="78" y="904" class="r" font-size="25" fill="#ECE5D5">The owner rejects it, because a later</text>
<text x="78" y="937" class="r" font-size="25" fill="#ECE5D5">request already ran. Nothing runs</text>
<text x="78" y="970" class="r" font-size="25" fill="#ECE5D5">again.</text>
<text x="587.3" y="846" class="s" font-size="28" fill="#ECE5D5" font-weight="700">The owner fails in a step</text>
<text x="587.3" y="904" class="r" font-size="25" fill="#ECE5D5">It answers ended with the code</text>
<text x="587.3" y="937" class="r" font-size="25" fill="#ECE5D5">owner_failure. The step possibly ran.</text>
<text x="1096.7" y="846" class="s" font-size="28" fill="#ECE5D5" font-weight="700">The connection breaks</text>
<text x="1096.7" y="904" class="r" font-size="25" fill="#ECE5D5">The session ends. The request without</text>
<text x="1096.7" y="937" class="r" font-size="25" fill="#ECE5D5">a response possibly ran.</text>
<text x="84" y="1064" class="s" font-size="24" fill="#AAB7BE" font-weight="600">POSSIBLY EXECUTED</text>
<text x="84" y="1102" class="r" font-size="25" fill="#ECE5D5">In a session, at most one call can be possibly executed, and it is always the last one. Lean proofs cover these owner rules for every</text>
<text x="84" y="1135" class="r" font-size="25" fill="#ECE5D5">sequence of requests, and 8,730 fault trials with real programs found no wrong result, no step run twice, and no false report.</text>
</svg>
