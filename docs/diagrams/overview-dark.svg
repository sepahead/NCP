<text x="1406.1" y="43.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">PROPOSED DESIGN</text>
<text x="52" y="46" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">ADMISSION OVERVIEW</text>
<text x="52" y="114" class="s" font-size="38" fill="#8DB2D8" font-weight="700">Five shared gates run in order, and actions add a body gate</text>
<text x="90" y="215.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">1</text>
<text x="122" y="216" class="s" font-size="26" fill="#ECE5D5" font-weight="700">Bound raw</text>
<text x="122" y="248" class="s" font-size="26" fill="#ECE5D5" font-weight="700">bytes</text>
<text x="78" y="306" class="r" font-size="25" fill="#ECE5D5">Frame size, depth,</text>
<text x="78" y="339" class="r" font-size="25" fill="#ECE5D5">and members</text>
<text x="78" y="372" class="r" font-size="25" fill="#ECE5D5">before semantic</text>
<text x="78" y="405" class="r" font-size="25" fill="#ECE5D5">allocation.</text>
<text x="398.8" y="215.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">2</text>
<text x="430.8" y="216" class="s" font-size="26" fill="#ECE5D5" font-weight="700">Authenticate</text>
<text x="386.8" y="306" class="r" font-size="25" fill="#ECE5D5">Verified transport</text>
<text x="386.8" y="339" class="r" font-size="25" fill="#ECE5D5">principal and</text>
<text x="386.8" y="372" class="r" font-size="25" fill="#ECE5D5">default-deny</text>
<text x="386.8" y="405" class="r" font-size="25" fill="#ECE5D5">manifest.</text>
<text x="707.6" y="215.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">3</text>
<text x="739.6" y="216" class="s" font-size="26" fill="#ECE5D5" font-weight="700">Wire and</text>
<text x="739.6" y="248" class="s" font-size="26" fill="#ECE5D5" font-weight="700">core</text>
<text x="695.6" y="306" class="r" font-size="25" fill="#ECE5D5">Canonical</text>
<text x="695.6" y="339" class="r" font-size="25" fill="#ECE5D5">same-major</text>
<text x="695.6" y="372" class="r" font-size="25" fill="#ECE5D5">version and exact</text>
<text x="695.6" y="405" class="r" font-size="25" fill="#ECE5D5">stable core.</text>
<text x="1016.4" y="215.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">4</text>
<text x="1048.4" y="216" class="s" font-size="26" fill="#ECE5D5" font-weight="700">Session and</text>
<text x="1048.4" y="248" class="s" font-size="26" fill="#ECE5D5" font-weight="700">stream</text>
<text x="1004.4" y="306" class="r" font-size="25" fill="#ECE5D5">Live generation,</text>
<text x="1004.4" y="339" class="r" font-size="25" fill="#ECE5D5">declared epoch,</text>
<text x="1004.4" y="372" class="r" font-size="25" fill="#ECE5D5">and unused</text>
<text x="1004.4" y="405" class="r" font-size="25" fill="#ECE5D5">position.</text>
<text x="1325.2" y="215.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">5</text>
<text x="1357.2" y="216" class="s" font-size="26" fill="#ECE5D5" font-weight="700">Typed</text>
<text x="1357.2" y="248" class="s" font-size="26" fill="#ECE5D5" font-weight="700">delivery</text>
<text x="1313.2" y="306" class="r" font-size="25" fill="#ECE5D5">Prepared layout</text>
<text x="1313.2" y="339" class="r" font-size="25" fill="#ECE5D5">into one finite</text>
<text x="1313.2" y="372" class="r" font-size="25" fill="#ECE5D5">plane queue.</text>
<text x="1325.2" y="596.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">6</text>
<text x="1357.2" y="597" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Body effect</text>
<text x="1357.2" y="629" class="s" font-size="28" fill="#ECE5D5" font-weight="700">gate</text>
<text x="1313.2" y="687" class="r" font-size="25" fill="#ECE5D5">The body admits</text>
<text x="1313.2" y="720" class="r" font-size="25" fill="#ECE5D5">the exact</text>
<text x="1313.2" y="753" class="r" font-size="25" fill="#ECE5D5">command before</text>
<text x="1313.2" y="786" class="r" font-size="25" fill="#ECE5D5">executor work.</text>
<text x="1399.6" y="491" class="s" font-size="24" fill="#AAB7BE" font-weight="600" text-anchor="end">action only</text>
<text x="78" y="597" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Four core planes</text>
<text x="78" y="655" class="r" font-size="25" fill="#ECE5D5">Control: commander and body exchange bounded requests. Overflow rejects.</text>
<text x="78" y="688" class="r" font-size="25" fill="#ECE5D5">Perception: the body publishes samples. The latest sample replaces older ones.</text>
<text x="78" y="721" class="r" font-size="25" fill="#ECE5D5">Action: the lease holder or an enrolled emergency source commands the body.</text>
<text x="78" y="754" class="r" font-size="25" fill="#ECE5D5">Observation: the body feeds read-only observers. The oldest item drops first.</text>
<text x="84" y="880" class="s" font-size="24" fill="#AAB7BE" font-weight="600">CURRENT STATUS</text>
<text x="84" y="918" class="r" font-size="25" fill="#ECE5D5">Direct production-secure Zenoh ingress fails closed. The pinned Zenoh 1.9.0 callback does not expose the verified peer principal.</text>
</svg>
