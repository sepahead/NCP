<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="979" viewBox="0 0 1600 979" role="img" aria-labelledby="overview-title overview-desc">
<title id="overview-title">NCP admission and plane overview</title>
<desc id="overview-desc">Five shared gates bound raw bytes, authenticate the transport principal, check wire and stable core, check session and stream state, and deliver a typed frame to a finite plane queue. Action adds a body effect gate. Proposed design for the UNRELEASED 1.0 candidate. It is not release or certification evidence.</desc>
