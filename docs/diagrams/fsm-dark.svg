<text x="1406.8" y="43.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">CURRENT RUNTIME</text>
<text x="52" y="46" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">PLANT ADMISSION STATES</text>
<text x="52" y="114" class="s" font-size="38" fill="#8DB2D8" font-weight="700">The current governor outputs only bounded candidates</text>
<text x="78" y="316" class="s" font-size="28" fill="#ECE5D5" font-weight="700">CONFIG FAIL-CLOSED</text>
<text x="78" y="374" class="r" font-size="25" fill="#ECE5D5">Invalid configuration. A</text>
<text x="78" y="407" class="r" font-size="25" fill="#ECE5D5">non-ESTOP input returns</text>
<text x="78" y="440" class="r" font-size="25" fill="#ECE5D5">HOLD.</text>
<text x="616.7" y="316" class="s" font-size="28" fill="#ECE5D5" font-weight="700">HOLD</text>
<text x="616.7" y="374" class="r" font-size="25" fill="#ECE5D5">Non-latching. The body applies</text>
<text x="616.7" y="407" class="r" font-size="25" fill="#ECE5D5">its installed HOLD action.</text>
<text x="1155.3" y="316" class="s" font-size="28" fill="#ECE5D5" font-weight="700">ACTIVE</text>
<text x="1155.3" y="374" class="r" font-size="25" fill="#ECE5D5">Valid command, fresh sensor,</text>
<text x="1155.3" y="407" class="r" font-size="25" fill="#ECE5D5">and live authority.</text>
<text x="616.7" y="672" class="s" font-size="28" fill="#ECE5D5" font-weight="700">ESTOP (latched)</text>
<text x="616.7" y="730" class="r" font-size="25" fill="#ECE5D5">Only a deployment reset leaves ESTOP. The body applies its installed ESTOP</text>
<text x="616.7" y="763" class="r" font-size="25" fill="#ECE5D5">action.</text>
<text x="830" y="201" class="s" font-size="24" fill="#AAB7BE" font-weight="600">start</text>
<text x="801" y="240.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">A</text>
<text x="470.7" y="200.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">G</text>
<text x="1069.3" y="337.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">B</text>
<text x="1069.3" y="397.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">C</text>
<text x="800" y="545.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">D</text>
<text x="1338.7" y="545.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">D</text>
<text x="78" y="672" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Deployment reset</text>
<text x="78" y="730" class="r" font-size="25" fill="#ECE5D5">Retire the generation, authority,</text>
<text x="78" y="763" class="r" font-size="25" fill="#ECE5D5">lease, and streams. A new</text>
<text x="78" y="796" class="r" font-size="25" fill="#ECE5D5">session starts in HOLD.</text>
<text x="530.7" y="723.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">E</text>
<text x="78" y="918" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Transitions</text>
<text x="78" y="976" class="r" font-size="25" fill="#ECE5D5">A valid configuration opens in HOLD. G invalid configuration fails closed.</text>
<text x="78" y="1009" class="r" font-size="25" fill="#ECE5D5">B fresh sensor, live authority, and a valid Active command enter ACTIVE.</text>
<text x="78" y="1042" class="r" font-size="25" fill="#ECE5D5">C stale or invalid input returns to HOLD without a latch.</text>
<text x="78" y="1075" class="r" font-size="25" fill="#ECE5D5">D an admitted ESTOP, geofence breach, link burst, or sensor silence latches ESTOP.</text>
<text x="78" y="1108" class="r" font-size="25" fill="#ECE5D5">E only a deployment reset leaves ESTOP. It starts a new generation.</text>
<text x="84" y="1202" class="s" font-size="24" fill="#AAB7BE" font-weight="600">INVARIANT</text>
<text x="84" y="1240" class="r" font-size="25" fill="#ECE5D5">An unattributable envelope or a missing safe frame latches local ESTOP and returns an error, not a wire frame.</text>
<text x="84" y="1273" class="r" font-size="25" fill="#ECE5D5">NCP defines no universal zero-safe action. The plant profile names each action.</text>
</svg>
