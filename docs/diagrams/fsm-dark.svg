<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1334" viewBox="0 0 1600 1334" role="img" aria-labelledby="fsm-title fsm-desc">
<title id="fsm-title">NCP current plant-admission state model</title>
<desc id="fsm-desc">The current compatibility governor starts in HOLD after valid configuration. It enters Active only with fresh input and live authority. An admitted ESTOP, a geofence breach, a link burst, or sustained sensor silence latches ESTOP. Only a deployment reset leaves ESTOP. Invalid configuration fails closed. Current UNRELEASED runtime. It is not release or certification evidence.</desc>
