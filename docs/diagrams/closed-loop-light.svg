<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1073" viewBox="0 0 1600 1073" role="img" aria-labelledby="closed-loop-title closed-loop-desc">
<title id="closed-loop-title">NCP closed-loop evidence boundary</title>
<desc id="closed-loop-desc">A feedback cycle runs from plant state through sensing, a retained source record, a controller proposal, body admission, and disposition to actuator input. NCP records three software events. It cannot measure the physical response or establish stability. UNRELEASED. It is not release or certification evidence.</desc>
