<text x="52" y="46" class="s" font-size="24" fill="#4D5C64" font-weight="700" letter-spacing="2">CLOSED LOOP</text>
<text x="52" y="114" class="s" font-size="38" fill="#1F3F60" font-weight="700">Protocol success does not establish loop stability</text>
<text x="52" y="158" class="s" font-size="24" fill="#4D5C64" font-weight="600">Tinted boxes mark the three software events that NCP records.</text>
<text x="78" y="246" class="s" font-size="28" fill="#2C3E50" font-weight="700">Plant</text>
<text x="78" y="304" class="r" font-size="25" fill="#2C3E50">State x at sample k.</text>
<text x="467" y="246" class="s" font-size="28" fill="#2C3E50" font-weight="700">Sensor</text>
<text x="467" y="304" class="r" font-size="25" fill="#2C3E50">Observation from state</text>
<text x="467" y="337" class="r" font-size="25" fill="#2C3E50">and disturbance.</text>
<text x="856" y="246" class="s" font-size="28" fill="#2C3E50" font-weight="700">Source record</text>
<text x="856" y="304" class="r" font-size="25" fill="#2C3E50">Retained at the sample</text>
<text x="856" y="337" class="r" font-size="25" fill="#2C3E50">time.</text>
<text x="1245" y="246" class="s" font-size="28" fill="#2C3E50" font-weight="700">Controller</text>
<text x="1245" y="304" class="r" font-size="25" fill="#2C3E50">Proposes an action from</text>
<text x="1245" y="337" class="r" font-size="25" fill="#2C3E50">the record.</text>
<text x="78" y="539" class="s" font-size="28" fill="#2C3E50" font-weight="700">Physical response</text>
<text x="78" y="597" class="r" font-size="25" fill="#2C3E50">Outside the software</text>
<text x="78" y="630" class="r" font-size="25" fill="#2C3E50">record.</text>
<text x="467" y="539" class="s" font-size="28" fill="#2C3E50" font-weight="700">Actuator input</text>
<text x="467" y="597" class="r" font-size="25" fill="#2C3E50">The plant input u at</text>
<text x="467" y="630" class="r" font-size="25" fill="#2C3E50">sample k.</text>
<text x="856" y="539" class="s" font-size="28" fill="#2C3E50" font-weight="700">Disposition</text>
<text x="856" y="597" class="r" font-size="25" fill="#2C3E50">Terminal software</text>
<text x="856" y="630" class="r" font-size="25" fill="#2C3E50">outcome.</text>
<text x="1245" y="539" class="s" font-size="28" fill="#2C3E50" font-weight="700">Body admission</text>
<text x="1245" y="597" class="r" font-size="25" fill="#2C3E50">Accepts before the</text>
<text x="1245" y="630" class="r" font-size="25" fill="#2C3E50">exclusive deadline.</text>
<text x="1403.5" y="427" class="s" font-size="24" fill="#4D5C64" font-weight="600">proposal</text>
<text x="236.5" y="427" class="s" font-size="24" fill="#4D5C64" font-weight="600">next state</text>
<text x="90" y="755.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">1</text>
<text x="122" y="756" class="s" font-size="28" fill="#2C3E50" font-weight="700">Latency on one body clock</text>
<text x="78" y="814" class="r" font-size="25" fill="#2C3E50">Admission latency = admission time − sample time.</text>
<text x="78" y="847" class="r" font-size="25" fill="#2C3E50">Disposition latency = disposition time − sample time.</text>
<text x="854" y="755.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">2</text>
<text x="886" y="756" class="s" font-size="28" fill="#2C3E50" font-weight="700">Exclusive deadline</text>
<text x="842" y="814" class="r" font-size="25" fill="#2C3E50">Admission at time t is live only when t &lt; deadline.</text>
<text x="842" y="847" class="r" font-size="25" fill="#2C3E50">A missing event is undefined, never zero.</text>
<text x="84" y="941" class="s" font-size="24" fill="#4D5C64" font-weight="600">STABILITY</text>
<text x="84" y="979" class="r" font-size="25" fill="#2C3E50">Stability depends on the plant, controller, sampling, and delay. For the update x(k+1) = (1 − 2Δ) x(k), a period Δ of 0.1 s</text>
<text x="84" y="1012" class="r" font-size="25" fill="#2C3E50">keeps 80 percent of the error per step. A period of 1 s flips its sign without decay. Message delivery is the same in both cases.</text>
</svg>
