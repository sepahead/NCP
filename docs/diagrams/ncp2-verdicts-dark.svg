<text x="1458.6" y="43.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">REVISION 7</text>
<text x="52" y="46" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">NCP 2 VERDICTS</text>
<text x="52" y="114" class="s" font-size="38" fill="#8DB2D8" font-weight="700">Every answer has one place</text>
<text x="78" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Executed</text>
<text x="78" y="248" class="s" font-size="25" fill="#6FC1BD" font-weight="600">It ran once</text>
<text x="78" y="306" class="r" font-size="25" fill="#ECE5D5">The owner executed the</text>
<text x="78" y="339" class="r" font-size="25" fill="#ECE5D5">request one time.</text>
<text x="78" y="380" class="s" font-size="24" fill="#AAB7BE" font-weight="600">ok</text>
<text x="94" y="429" class="s" font-size="25" fill="#ECE5D5" font-weight="600">ok</text>
<text x="78" y="488" class="s" font-size="24" fill="#AAB7BE" font-weight="600">ended</text>
<text x="94" y="537" class="s" font-size="25" fill="#ECE5D5" font-weight="600">result_too_large</text>
<text x="440" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Not executed</text>
<text x="440" y="248" class="s" font-size="25" fill="#6FC1BD" font-weight="600">It never runs</text>
<text x="440" y="306" class="r" font-size="25" fill="#ECE5D5">The owner did not execute the</text>
<text x="440" y="339" class="r" font-size="25" fill="#ECE5D5">request, and it never will.</text>
<text x="440" y="380" class="s" font-size="24" fill="#AAB7BE" font-weight="600">declined</text>
<text x="456" y="429" class="s" font-size="25" fill="#ECE5D5" font-weight="600">unknown_op</text>
<text x="456" y="483" class="s" font-size="25" fill="#ECE5D5" font-weight="600">body_invalid</text>
<text x="456" y="537" class="s" font-size="25" fill="#ECE5D5" font-weight="600">conflict</text>
<text x="440" y="596" class="s" font-size="24" fill="#AAB7BE" font-weight="600">ended</text>
<text x="456" y="645" class="s" font-size="25" fill="#ECE5D5" font-weight="600">shutdown *</text>
<text x="456" y="699" class="s" font-size="25" fill="#ECE5D5" font-weight="600">bad_frame *</text>
<text x="440" y="758" class="s" font-size="24" fill="#AAB7BE" font-weight="600">rejected, in reply to open</text>
<text x="456" y="807" class="s" font-size="25" fill="#ECE5D5" font-weight="600">body_invalid</text>
<text x="456" y="861" class="s" font-size="25" fill="#ECE5D5" font-weight="600">contract_mismatch</text>
<text x="456" y="915" class="s" font-size="25" fill="#ECE5D5" font-weight="600">bound_unacceptable</text>
<text x="456" y="969" class="s" font-size="25" fill="#ECE5D5" font-weight="600">refused</text>
<text x="456" y="1023" class="s" font-size="25" fill="#ECE5D5" font-weight="600">any other code</text>
<text x="942" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Possibly executed</text>
<text x="942" y="248" class="s" font-size="25" fill="#6FC1BD" font-weight="600">The honest unknown</text>
<text x="942" y="306" class="r" font-size="25" fill="#ECE5D5">The client cannot know. At most one request of a</text>
<text x="942" y="339" class="r" font-size="25" fill="#ECE5D5">session ends here, and it is the last one.</text>
<text x="942" y="380" class="s" font-size="24" fill="#AAB7BE" font-weight="600">rejected, in reply to another request</text>
<text x="958" y="429" class="s" font-size="25" fill="#ECE5D5" font-weight="600">wrong_protocol</text>
<text x="1254" y="429" class="s" font-size="25" fill="#ECE5D5" font-weight="600">not_open</text>
<text x="958" y="483" class="s" font-size="25" fill="#ECE5D5" font-weight="600">wrong_session</text>
<text x="1254" y="483" class="s" font-size="25" fill="#ECE5D5" font-weight="600">seq_conflict</text>
<text x="958" y="537" class="s" font-size="25" fill="#ECE5D5" font-weight="600">seq_stale</text>
<text x="1254" y="537" class="s" font-size="25" fill="#ECE5D5" font-weight="600">seq_gap</text>
<text x="958" y="591" class="s" font-size="25" fill="#ECE5D5" font-weight="600">session_ended</text>
<text x="1254" y="591" class="s" font-size="25" fill="#ECE5D5" font-weight="600">ack_missing</text>
<text x="958" y="645" class="s" font-size="25" fill="#ECE5D5" font-weight="600">ack_mismatch</text>
<text x="1254" y="645" class="s" font-size="25" fill="#ECE5D5" font-weight="600">already_open</text>
<text x="942" y="704" class="s" font-size="24" fill="#AAB7BE" font-weight="600">ended</text>
<text x="958" y="753" class="s" font-size="25" fill="#ECE5D5" font-weight="600">session_expired</text>
<text x="1254" y="753" class="s" font-size="25" fill="#ECE5D5" font-weight="600">owner_failure</text>
<text x="958" y="807" class="s" font-size="25" fill="#ECE5D5" font-weight="600">a code that the client does not know</text>
<text x="942" y="866" class="s" font-size="24" fill="#AAB7BE" font-weight="600">local events</text>
<text x="958" y="915" class="s" font-size="25" fill="#ECE5D5" font-weight="600">local.timeout</text>
<text x="1254" y="915" class="s" font-size="25" fill="#ECE5D5" font-weight="600">local.closed</text>
<text x="958" y="969" class="s" font-size="25" fill="#ECE5D5" font-weight="600">local.protocol</text>
<text x="1254" y="969" class="s" font-size="25" fill="#ECE5D5" font-weight="600">local.bad_frame</text>
<text x="84" y="1117" class="s" font-size="24" fill="#AAB7BE" font-weight="600">HOW TO READ IT</text>
<text x="84" y="1155" class="r" font-size="25" fill="#ECE5D5">A client acts on the outcome first and on the code second. After a code that it does not know: rejected means that the frame was</text>
<text x="84" y="1188" class="r" font-size="25" fill="#ECE5D5">not admitted, declined means that the request never executes, and ended means possibly executed.</text>
<text x="84" y="1221" class="r" font-size="25" fill="#ECE5D5">A rejected open leaves no session. A delayed copy of that open can still open one later (rule 7.1.8), but the client is not in it.</text>
<text x="84" y="1254" class="r" font-size="25" fill="#ECE5D5">* In a response that names no request, bad_frame and shutdown count as not executed only when the body binds the response to</text>
<text x="84" y="1287" class="r" font-size="25" fill="#ECE5D5">the client's chain. Otherwise the request is possibly executed.</text>
</svg>
