<title id="ncp2-verdicts-title">What each NCP 2 answer lets the client conclude</title>
<desc id="ncp2-verdicts-desc">Three columns sort every outcome, code, and local event by the client's verdict: executed, not executed, or possibly executed. The codes come from spec/ncp2-rules.json. NCP 2 is UNRELEASED. It is not release or certification evidence.</desc>
