<text x="52" y="46" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">NCP 2 EXCHANGE</text>
<text x="52" y="114" class="s" font-size="38" fill="#8DB2D8" font-weight="700">One request and one response for each step</text>
<text x="78" y="212" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Client</text>
<text x="78" y="244" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Runs the experiment</text>
<text x="586" y="212" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Owner</text>
<text x="586" y="244" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Runs one program</text>
<text x="938" y="363.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">1</text>
<text x="970" y="364" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Open the session</text>
<text x="926" y="422" class="r" font-size="25" fill="#ECE5D5">The client names the application and its contract by</text>
<text x="926" y="455" class="r" font-size="25" fill="#ECE5D5">identity. The owner answers with the largest frame</text>
<text x="926" y="488" class="r" font-size="25" fill="#ECE5D5">size of the session.</text>
<text x="938" y="583.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">2</text>
<text x="970" y="584" class="s" font-size="28" fill="#ECE5D5" font-weight="700">The receipt rides along</text>
<text x="926" y="642" class="r" font-size="25" fill="#ECE5D5">Each later request carries the identity of the last</text>
<text x="926" y="675" class="r" font-size="25" fill="#ECE5D5">response: the SHA-256 fingerprint of its bytes. That</text>
<text x="926" y="708" class="r" font-size="25" fill="#ECE5D5">is the acknowledgement, so a step needs one round</text>
<text x="926" y="741" class="r" font-size="25" fill="#ECE5D5">trip, not two.</text>
<text x="938" y="836.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">3</text>
<text x="970" y="837" class="s" font-size="28" fill="#ECE5D5" font-weight="700">A response is lost</text>
<text x="926" y="895" class="r" font-size="25" fill="#ECE5D5">On a link that can lose messages, the client sends the</text>
<text x="926" y="928" class="r" font-size="25" fill="#ECE5D5">same request again. The owner sends its kept</text>
<text x="926" y="961" class="r" font-size="25" fill="#ECE5D5">response again and does not execute the step a second</text>
<text x="926" y="994" class="r" font-size="25" fill="#ECE5D5">time.</text>
<text x="938" y="1089.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">4</text>
<text x="970" y="1090" class="s" font-size="28" fill="#ECE5D5" font-weight="700">One hash chain</text>
<text x="926" y="1148" class="r" font-size="25" fill="#ECE5D5">Each response names its request, and each request</text>
<text x="926" y="1181" class="r" font-size="25" fill="#ECE5D5">names the response before it. The identity of the last</text>
<text x="926" y="1214" class="r" font-size="25" fill="#ECE5D5">response commits to the whole session.</text>
<text x="456" y="361" class="s" font-size="25" fill="#ECE5D5" font-weight="600" text-anchor="middle">open, seq 0, contract identity</text>
<text x="456" y="441" class="s" font-size="25" fill="#ECE5D5" font-weight="600" text-anchor="middle">ok, session frame size</text>
<text x="456" y="597.5" class="s" font-size="25" fill="#ECE5D5" font-weight="600" text-anchor="middle">step, seq 1, receipt of response 0</text>
<text x="456" y="677.5" class="s" font-size="25" fill="#ECE5D5" font-weight="600" text-anchor="middle">ok, result of step 1</text>
<text x="456" y="850.5" class="s" font-size="25" fill="#ECE5D5" font-weight="600" text-anchor="middle">step, seq 2, receipt of response 1</text>
<text x="456" y="930.5" class="s" font-size="25" fill="#ECE5D5" font-weight="600" text-anchor="middle">ok, result of step 2</text>
<text x="456" y="1087" class="s" font-size="25" fill="#ECE5D5" font-weight="600" text-anchor="middle">close, seq 3, receipt of response 2</text>
<text x="456" y="1167" class="s" font-size="25" fill="#ECE5D5" font-weight="600" text-anchor="middle">ok, session closed</text>
<text x="84" y="1324" class="s" font-size="24" fill="#AAB7BE" font-weight="600">AFTER A FAILURE</text>
<text x="84" y="1362" class="r" font-size="25" fill="#ECE5D5">If the owner fails while it executes a step, the response says so, and the step is possibly executed. If the connection breaks, the</text>
<text x="84" y="1395" class="r" font-size="25" fill="#ECE5D5">request without a response is possibly executed. In either case, at most one call of the session is uncertain, and the session ends.</text>
</svg>
