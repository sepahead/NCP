<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1489" viewBox="0 0 1600 1489" role="img" aria-labelledby="ncp2-call-title ncp2-call-desc">
<title id="ncp2-call-title">An NCP 2 session: one round trip for each step</title>
<desc id="ncp2-call-desc">A client opens a session, sends two steps and a close, and gets one response for each. Each request carries the identity of the last response as its receipt, so the session forms one hash chain. NCP 2 is UNRELEASED. It is not release or certification evidence.</desc>
