<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1182" viewBox="0 0 1600 1182" role="img" aria-labelledby="topology-title topology-desc">
<title id="topology-title">NCP commander, body, and observer topology</title>
<desc id="topology-desc">A commander and a body exchange control, perception, and action traffic on four core planes. Observers receive a read-only projection. The body is the final software authority before the actuator. Candidate wire of the UNRELEASED 1.0 candidate. It is not release or certification evidence.</desc>
<defs>
