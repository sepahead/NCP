<text x="1396.7" y="43.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">CANDIDATE WIRE 1.0</text>
<text x="52" y="46" class="s" font-size="24" fill="#4D5C64" font-weight="700" letter-spacing="2">TOPOLOGY</text>
<text x="52" y="114" class="s" font-size="38" fill="#1F3F60" font-weight="700">Four core planes connect a commander, a body, and observers</text>
<text x="78" y="246" class="s" font-size="28" fill="#2C3E50" font-weight="700">Commander</text>
<text x="78" y="278" class="s" font-size="25" fill="#1F6968" font-weight="600">Neural or other</text>
<text x="78" y="308" class="s" font-size="25" fill="#1F6968" font-weight="600">controller</text>
<text x="78" y="366" class="r" font-size="25" fill="#2C3E50">Sends Active only with</text>
<text x="78" y="399" class="r" font-size="25" fill="#2C3E50">the body-issued lease.</text>
<text x="1244" y="246" class="s" font-size="28" fill="#2C3E50" font-weight="700">Body</text>
<text x="1244" y="278" class="s" font-size="25" fill="#1F6968" font-weight="600">Robot or UAV plant</text>
<text x="1244" y="336" class="r" font-size="25" fill="#2C3E50">Final software authority</text>
<text x="1244" y="369" class="r" font-size="25" fill="#2C3E50">before the actuator.</text>
<text x="1244" y="402" class="r" font-size="25" fill="#2C3E50">Role qualification:</text>
<text x="1244" y="435" class="r" font-size="25" fill="#2C3E50">NOT RUN.</text>
<text x="800" y="230" class="s" font-size="25" fill="#2C3E50" font-weight="600" text-anchor="middle">Control: request and reply</text>
<text x="800" y="264" class="s" font-size="25" fill="#4D5C64" text-anchor="middle">{realm}/rpc/{request_kind}</text>
<text x="800" y="348" class="s" font-size="25" fill="#2C3E50" font-weight="600" text-anchor="middle">Perception: body to commander</text>
<text x="800" y="382" class="s" font-size="25" fill="#4D5C64" text-anchor="middle">{realm}/session/{session_id}/sensor[/{channel}]</text>
<text x="800" y="466" class="s" font-size="25" fill="#2C3E50" font-weight="600" text-anchor="middle">Action: ACTIVE, HOLD, ESTOP. Init rejects.</text>
<text x="800" y="500" class="s" font-size="25" fill="#4D5C64" text-anchor="middle">{realm}/session/{session_id}/command[/{channel}]</text>
<text x="1244" y="770" class="s" font-size="28" fill="#2C3E50" font-weight="700">Observer</text>
<text x="1244" y="802" class="s" font-size="25" fill="#1F6968" font-weight="600">Read-only,</text>
<text x="1244" y="832" class="s" font-size="25" fill="#1F6968" font-weight="600">grant-bound</text>
<text x="1244" y="890" class="r" font-size="25" fill="#2C3E50">Receives a projection.</text>
<text x="1244" y="923" class="r" font-size="25" fill="#2C3E50">Holds no command</text>
<text x="1244" y="956" class="r" font-size="25" fill="#2C3E50">authority.</text>
<text x="1359" y="634" class="s" font-size="25" fill="#2C3E50" font-weight="600" text-anchor="end">Observation: body to observers</text>
<text x="1359" y="668" class="s" font-size="25" fill="#4D5C64" text-anchor="end">{realm}/session/{session_id}/observation</text>
<text x="84" y="1050" class="s" font-size="24" fill="#4D5C64" font-weight="600">TRUST BOUNDARY</text>
<text x="84" y="1088" class="r" font-size="25" fill="#2C3E50">A direct peer binds the verified transport principal. A forwarder ends one trust context and opens a new authenticated one.</text>
<text x="84" y="1121" class="r" font-size="25" fill="#2C3E50">Copied identity bytes are not transport evidence.</text>
</svg>
