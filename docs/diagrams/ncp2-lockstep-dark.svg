<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1944" viewBox="0 0 1600 1944" role="img" aria-labelledby="ncp2-lockstep-title ncp2-lockstep-desc">
<title id="ncp2-lockstep-title">Lockstep recovery: a delayed step and a copy of open</title>
<desc id="ncp2-lockstep-desc">A step is delayed, the client recovers in a new session, and a copy of the first open arrives. With a session name as holder, the late step ran after the verdict that it did not. With an opening as holder, it is declined. NCP 2 is UNRELEASED. It is not release or certification evidence.</desc>
