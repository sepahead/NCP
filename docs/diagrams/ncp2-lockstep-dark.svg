<text x="1458.6" y="43.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">REVISION 6</text>
<text x="52" y="46" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">NCP 2 LOCKSTEP</text>
<text x="52" y="114" class="s" font-size="38" fill="#8DB2D8" font-weight="700">A lost step gets a true verdict about the owner's state, or none</text>
<text x="78" y="212" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Client</text>
<text x="78" y="244" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Steps the world</text>
<text x="586" y="212" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Owner</text>
<text x="586" y="244" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Keeps one clock</text>
<text x="938" y="363.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">1</text>
<text x="970" y="364" class="s" font-size="28" fill="#ECE5D5" font-weight="700">A step is on its way</text>
<text x="926" y="422" class="r" font-size="25" fill="#ECE5D5">The client sends step s for tick 42 in its first opening.</text>
<text x="926" y="455" class="r" font-size="25" fill="#ECE5D5">No response arrives in time. The call ends: s possibly</text>
<text x="926" y="488" class="r" font-size="25" fill="#ECE5D5">ran.</text>
<text x="938" y="583.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">2</text>
<text x="970" y="584" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Recover in a new session</text>
<text x="926" y="642" class="r" font-size="25" fill="#ECE5D5">The client opens a new session. The open response</text>
<text x="926" y="675" class="r" font-size="25" fill="#ECE5D5">reports the clock and takes nothing. A take request,</text>
<text x="926" y="708" class="r" font-size="25" fill="#ECE5D5">which acknowledges that response, makes the new</text>
<text x="926" y="741" class="r" font-size="25" fill="#ECE5D5">opening the holder and returns the final clock: tick</text>
<text x="926" y="774" class="r" font-size="25" fill="#ECE5D5">41. The client concludes that s did not run, and never</text>
<text x="926" y="807" class="r" font-size="25" fill="#ECE5D5">will.</text>
<text x="938" y="949.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">3</text>
<text x="970" y="950" class="s" font-size="28" fill="#ECE5D5" font-weight="700">A copy of the first open</text>
<text x="926" y="1008" class="r" font-size="25" fill="#ECE5D5">A party on the path sends the first open again, on a</text>
<text x="926" y="1041" class="r" font-size="25" fill="#ECE5D5">third connection. The owner accepts it as a third</text>
<text x="926" y="1074" class="r" font-size="25" fill="#ECE5D5">opening, with the same session name and a new</text>
<text x="926" y="1107" class="r" font-size="25" fill="#ECE5D5">nonce.</text>
<text x="938" y="1202.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">4</text>
<text x="970" y="1203" class="s" font-size="28" fill="#ECE5D5" font-weight="700">The delayed step arrives</text>
<text x="926" y="1261" class="r" font-size="25" fill="#ECE5D5">Step s reaches the first opening, whose owner still</text>
<text x="926" y="1294" class="r" font-size="25" fill="#ECE5D5">waits for its next request. What happens depends on</text>
<text x="926" y="1327" class="r" font-size="25" fill="#ECE5D5">what the holder is.</text>
<text x="547.8" y="413.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">DELAYED</text>
<text x="339" y="391" class="s" font-size="25" fill="#ECE5D5" font-weight="600" text-anchor="middle">step s, tick 42</text>
<text x="456" y="564" class="s" font-size="25" fill="#ECE5D5" font-weight="600" text-anchor="middle">open, a new session</text>
<text x="456" y="644" class="s" font-size="25" fill="#ECE5D5" font-weight="600" text-anchor="middle">ok, report: tick 41, term 7</text>
<text x="456" y="724" class="s" font-size="25" fill="#ECE5D5" font-weight="600" text-anchor="middle">take, term 7</text>
<text x="456" y="804" class="s" font-size="25" fill="#ECE5D5" font-weight="600" text-anchor="middle">ok, final: tick 41, term 8</text>
<text x="418.7" y="1016" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">COPY OF THE FIRST OPEN</text>
<text x="356" y="1252.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">STEP s ARRIVES</text>
<text x="52" y="1443" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">WHEN THE DELAYED STEP ARRIVES</text>
<text x="78" y="1529" class="s" font-size="28" fill="#ECE5D5" font-weight="700">The holder is a session name</text>
<text x="78" y="1561" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Until revision 4</text>
<text x="78" y="1619" class="r" font-size="25" fill="#ECE5D5">The copy of open made the session name the holder again.</text>
<text x="78" y="1652" class="r" font-size="25" fill="#ECE5D5">Step s ran, and the world moved to tick 42. The verdict that</text>
<text x="78" y="1685" class="r" font-size="25" fill="#ECE5D5">s did not run was false.</text>
<text x="842" y="1529" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Only a take takes the ticks</text>
<text x="842" y="1561" class="s" font-size="25" fill="#6FC1BD" font-weight="600">From revision 6</text>
<text x="842" y="1619" class="r" font-size="25" fill="#ECE5D5">The second opening took the ticks with its take, and the copy</text>
<text x="842" y="1652" class="r" font-size="25" fill="#ECE5D5">of open took nothing. Step s is declined and never runs. The</text>
<text x="842" y="1685" class="r" font-size="25" fill="#ECE5D5">verdict stays true.</text>
<text x="84" y="1779" class="s" font-size="24" fill="#AAB7BE" font-weight="600">WHAT A COPY CAN STILL DO</text>
<text x="84" y="1817" class="r" font-size="25" fill="#ECE5D5">A copy of open opens a session and reads the clock. It cannot take the ticks: a take must acknowledge the open response of its</text>
<text x="84" y="1850" class="r" font-size="25" fill="#ECE5D5">own opening, which holds a fresh nonce. An exhaustive check of the Python SDK with one fault found no verdict that the</text>
<text x="84" y="1883" class="r" font-size="25" fill="#ECE5D5">owner's state contradicts. The profile is not proved.</text>
</svg>
