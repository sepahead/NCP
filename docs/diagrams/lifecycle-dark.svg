<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1257" viewBox="0 0 1600 1257" role="img" aria-labelledby="lifecycle-title lifecycle-desc">
<title id="lifecycle-title">NCP session lifecycle mutation owner</title>
<desc id="lifecycle-desc">One slot per namespace moves from free to pending, then to terminal directly or through ambiguous reconciliation. Terminal commit publishes the result and high-water before it frees the slot. Exact retries return the retained result. Proposed design for the UNRELEASED 1.0 candidate. It is not release or certification evidence.</desc>
