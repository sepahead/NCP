<text x="1406.1" y="43.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">PROPOSED DESIGN</text>
<text x="52" y="46" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">SESSION LIFECYCLE</text>
<text x="52" y="114" class="s" font-size="38" fill="#8DB2D8" font-weight="700">One slot serializes open, replace, and close per namespace</text>
<text x="78" y="316" class="s" font-size="28" fill="#ECE5D5" font-weight="700">FREE</text>
<text x="78" y="374" class="r" font-size="25" fill="#ECE5D5">No active record.</text>
<text x="479.5" y="316" class="s" font-size="28" fill="#ECE5D5" font-weight="700">PENDING</text>
<text x="479.5" y="374" class="r" font-size="25" fill="#ECE5D5">Durable reservation.</text>
<text x="479.5" y="407" class="r" font-size="25" fill="#ECE5D5">Work can run.</text>
<text x="881" y="316" class="s" font-size="28" fill="#ECE5D5" font-weight="700">AMBIGUOUS</text>
<text x="881" y="374" class="r" font-size="25" fill="#ECE5D5">Effect unknown.</text>
<text x="881" y="407" class="r" font-size="25" fill="#ECE5D5">Same operation</text>
<text x="881" y="440" class="r" font-size="25" fill="#ECE5D5">fenced.</text>
<text x="1282.5" y="316" class="s" font-size="28" fill="#ECE5D5" font-weight="700">TERMINAL</text>
<text x="1282.5" y="374" class="r" font-size="25" fill="#ECE5D5">Result and</text>
<text x="1282.5" y="407" class="r" font-size="25" fill="#ECE5D5">high-water are</text>
<text x="1282.5" y="440" class="r" font-size="25" fill="#ECE5D5">durable.</text>
<text x="398.5" y="367.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">A</text>
<text x="800" y="367.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">C</text>
<text x="1201.5" y="367.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">D</text>
<text x="1000.8" y="202.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">B</text>
<text x="800" y="532.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">E</text>
<text x="78" y="634" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Transitions</text>
<text x="78" y="692" class="r" font-size="25" fill="#ECE5D5">A reserve: make the slot, result cell, and context durable before external work.</text>
<text x="78" y="725" class="r" font-size="25" fill="#ECE5D5">B definitive result: commit the terminal record.</text>
<text x="78" y="758" class="r" font-size="25" fill="#ECE5D5">C effect unknown: keep the same operation and coordinate fenced.</text>
<text x="78" y="791" class="r" font-size="25" fill="#ECE5D5">D reconcile: query the same backend coordinate, then commit.</text>
<text x="78" y="824" class="r" font-size="25" fill="#ECE5D5">E release: publish the result and high-water, then free the slot.</text>
<text x="78" y="940" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Exact retry</text>
<text x="78" y="998" class="r" font-size="25" fill="#ECE5D5">Equal coordinate, request bytes,</text>
<text x="78" y="1031" class="r" font-size="25" fill="#ECE5D5">context bytes, and ordinal return the</text>
<text x="78" y="1064" class="r" font-size="25" fill="#ECE5D5">retained result.</text>
<text x="587.3" y="940" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Conflict</text>
<text x="587.3" y="998" class="r" font-size="25" fill="#ECE5D5">Any other combination rejects</text>
<text x="587.3" y="1031" class="r" font-size="25" fill="#ECE5D5">without mutation.</text>
<text x="1096.7" y="940" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Capacity failure</text>
<text x="1096.7" y="998" class="r" font-size="25" fill="#ECE5D5">A full store rejects with no state and</text>
<text x="1096.7" y="1031" class="r" font-size="25" fill="#ECE5D5">no external effect.</text>
<text x="84" y="1158" class="s" font-size="24" fill="#AAB7BE" font-weight="600">SERVICE SHAPE</text>
<text x="84" y="1196" class="r" font-size="25" fill="#ECE5D5">Shared finite stores serve all namespaces. No thread, socket, or store exists per session.</text>
</svg>
