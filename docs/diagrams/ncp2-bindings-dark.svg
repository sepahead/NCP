<text x="52" y="46" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">NCP 2 LINKS</text>
<text x="52" y="114" class="s" font-size="38" fill="#8DB2D8" font-weight="700">The same frames and rules over every kind of link</text>
<text x="78" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Pipe pair</text>
<text x="78" y="248" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Child process</text>
<text x="78" y="306" class="r" font-size="25" fill="#ECE5D5">The owner runs as a child</text>
<text x="78" y="339" class="r" font-size="25" fill="#ECE5D5">process and speaks on its</text>
<text x="78" y="372" class="r" font-size="25" fill="#ECE5D5">standard input and</text>
<text x="78" y="405" class="r" font-size="25" fill="#ECE5D5">output. The simplest local</text>
<text x="78" y="438" class="r" font-size="25" fill="#ECE5D5">link.</text>
<text x="460" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Unix socket</text>
<text x="460" y="248" class="s" font-size="25" fill="#6FC1BD" font-weight="600">One computer</text>
<text x="460" y="306" class="r" font-size="25" fill="#ECE5D5">One session for each</text>
<text x="460" y="339" class="r" font-size="25" fill="#ECE5D5">connection, each in its own</text>
<text x="460" y="372" class="r" font-size="25" fill="#ECE5D5">thread. File permissions</text>
<text x="460" y="405" class="r" font-size="25" fill="#ECE5D5">decide who may connect.</text>
<text x="842" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">TCP</text>
<text x="842" y="248" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Trusted network</text>
<text x="842" y="306" class="r" font-size="25" fill="#ECE5D5">Between computers on a</text>
<text x="842" y="339" class="r" font-size="25" fill="#ECE5D5">network that you trust, or</text>
<text x="842" y="372" class="r" font-size="25" fill="#ECE5D5">with TLS on both sides. A</text>
<text x="842" y="405" class="r" font-size="25" fill="#ECE5D5">time limit for each call is</text>
<text x="842" y="438" class="r" font-size="25" fill="#ECE5D5">an option.</text>
<text x="1224" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Zenoh</text>
<text x="1224" y="248" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Lossy or open network</text>
<text x="1224" y="306" class="r" font-size="25" fill="#ECE5D5">Requests travel as queries.</text>
<text x="1224" y="339" class="r" font-size="25" fill="#ECE5D5">A lost message is sent</text>
<text x="1224" y="372" class="r" font-size="25" fill="#ECE5D5">again, and the owner</text>
<text x="1224" y="405" class="r" font-size="25" fill="#ECE5D5">answers with its kept</text>
<text x="1224" y="438" class="r" font-size="25" fill="#ECE5D5">response. Configure</text>
<text x="1224" y="471" class="r" font-size="25" fill="#ECE5D5">mutual TLS and access</text>
<text x="1224" y="504" class="r" font-size="25" fill="#ECE5D5">control on both sides.</text>
<text x="78" y="626" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Streams</text>
<text x="78" y="658" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Live data</text>
<text x="78" y="716" class="r" font-size="25" fill="#ECE5D5">A publisher numbers its messages, and each names the one</text>
<text x="78" y="749" class="r" font-size="25" fill="#ECE5D5">before. Subscribers see lost, repeated, and changed messages.</text>
<text x="78" y="782" class="r" font-size="25" fill="#ECE5D5">Nothing is sent again.</text>
<text x="842" y="626" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Rounds</text>
<text x="842" y="658" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Many agents, one world</text>
<text x="842" y="716" class="r" font-size="25" fill="#ECE5D5">Many agents share one owner. Each round applies their</text>
<text x="842" y="749" class="r" font-size="25" fill="#ECE5D5">requests in a fixed order, and every agent receives the same</text>
<text x="842" y="782" class="r" font-size="25" fill="#ECE5D5">record of the round.</text>
<text x="84" y="876" class="s" font-size="24" fill="#AAB7BE" font-weight="600">SMALL BY DESIGN</text>
<text x="84" y="914" class="r" font-size="25" fill="#ECE5D5">The Python SDK uses only the standard library, and the Rust SDK needs four crates. The Zenoh binding is a separate, optional</text>
<text x="84" y="947" class="r" font-size="25" fill="#ECE5D5">package for both languages; the rounds profile is in the Python SDK.</text>
</svg>
