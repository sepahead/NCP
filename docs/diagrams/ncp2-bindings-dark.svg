<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1008" viewBox="0 0 1600 1008" role="img" aria-labelledby="ncp2-bindings-title ncp2-bindings-desc">
<title id="ncp2-bindings-title">NCP 2 links, streams, and rounds</title>
<desc id="ncp2-bindings-desc">The same NCP 2 frames travel over a pipe pair, a Unix domain socket, TCP, and Zenoh for networks that can lose messages. Streams carry live data, and rounds let many agents share one owner. NCP 2 is UNRELEASED. It is not release or certification evidence.</desc>
