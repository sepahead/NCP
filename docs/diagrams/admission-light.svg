<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1189" viewBox="0 0 1600 1189" role="img" aria-labelledby="admission-title admission-desc">
<title id="admission-title">NCP body command admission</title>
<desc id="admission-desc">The body bounds, authenticates, and decodes each command once, finds its exact position, and checks the live grant. ESTOP selects a preallocated latch, HOLD cuts Active authority, and Active needs a single-use token. Proposed design for the UNRELEASED 1.0 candidate. It is not release or certification evidence.</desc>
