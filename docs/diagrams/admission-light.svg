<text x="1406.1" y="43.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">PROPOSED DESIGN</text>
<text x="52" y="46" class="s" font-size="24" fill="#4D5C64" font-weight="700" letter-spacing="2">BODY COMMAND ADMISSION</text>
<text x="52" y="114" class="s" font-size="38" fill="#1F3F60" font-weight="700">The body decides each command before any effect</text>
<text x="90" y="215.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">1</text>
<text x="122" y="216" class="s" font-size="26" fill="#2C3E50" font-weight="700">Raw bounds</text>
<text x="78" y="306" class="r" font-size="25" fill="#2C3E50">Size and frame</text>
<text x="78" y="339" class="r" font-size="25" fill="#2C3E50">class first.</text>
<text x="398.8" y="215.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">2</text>
<text x="430.8" y="216" class="s" font-size="26" fill="#2C3E50" font-weight="700">Authenticate</text>
<text x="386.8" y="306" class="r" font-size="25" fill="#2C3E50">Principal and</text>
<text x="386.8" y="339" class="r" font-size="25" fill="#2C3E50">exact permission.</text>
<text x="707.6" y="215.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">3</text>
<text x="739.6" y="216" class="s" font-size="26" fill="#2C3E50" font-weight="700">Session state</text>
<text x="695.6" y="306" class="r" font-size="25" fill="#2C3E50">Generation,</text>
<text x="695.6" y="339" class="r" font-size="25" fill="#2C3E50">stream, and</text>
<text x="695.6" y="372" class="r" font-size="25" fill="#2C3E50">security.</text>
<text x="1016.4" y="215.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">4</text>
<text x="1048.4" y="216" class="s" font-size="26" fill="#2C3E50" font-weight="700">Decode once</text>
<text x="1004.4" y="306" class="r" font-size="25" fill="#2C3E50">One bounded</text>
<text x="1004.4" y="339" class="r" font-size="25" fill="#2C3E50">decode.</text>
<text x="1325.2" y="215.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">5</text>
<text x="1357.2" y="216" class="s" font-size="26" fill="#2C3E50" font-weight="700">Exact</text>
<text x="1357.2" y="248" class="s" font-size="26" fill="#2C3E50" font-weight="700">position</text>
<text x="1313.2" y="306" class="r" font-size="25" fill="#2C3E50">Same bytes return</text>
<text x="1313.2" y="339" class="r" font-size="25" fill="#2C3E50">the result.</text>
<text x="528" y="544" class="s" font-size="28" fill="#2C3E50" font-weight="700">ESTOP</text>
<text x="528" y="602" class="r" font-size="25" fill="#2C3E50">Install or keep the one preallocated latch.</text>
<text x="528" y="708" class="s" font-size="28" fill="#2C3E50" font-weight="700">HOLD</text>
<text x="528" y="766" class="r" font-size="25" fill="#2C3E50">Reserve HOLD and cut Active in one owner step.</text>
<text x="528" y="872" class="s" font-size="28" fill="#2C3E50" font-weight="700">Active</text>
<text x="528" y="930" class="r" font-size="25" fill="#2C3E50">Check profile, freshness, and source. Issue one</text>
<text x="528" y="963" class="r" font-size="25" fill="#2C3E50">token.</text>
<text x="1256" y="543.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">6</text>
<text x="1288" y="544" class="s" font-size="28" fill="#2C3E50" font-weight="700">Grant check</text>
<text x="1244" y="602" class="r" font-size="25" fill="#2C3E50">The position selects one</text>
<text x="1244" y="635" class="r" font-size="25" fill="#2C3E50">live grant with an</text>
<text x="1244" y="668" class="r" font-size="25" fill="#2C3E50">exclusive deadline.</text>
<text x="90" y="543.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">7</text>
<text x="122" y="544" class="s" font-size="28" fill="#2C3E50" font-weight="700">Effect boundary</text>
<text x="78" y="602" class="r" font-size="25" fill="#2C3E50">Installed restrictive actions</text>
<text x="78" y="635" class="r" font-size="25" fill="#2C3E50">and the Active executor</text>
<text x="78" y="668" class="r" font-size="25" fill="#2C3E50">slot. Device work starts</text>
<text x="78" y="701" class="r" font-size="25" fill="#2C3E50">after this handoff.</text>
<text x="84" y="1057" class="s" font-size="24" fill="#4D5C64" font-weight="600">REJECTIONS</text>
<text x="84" y="1095" class="r" font-size="25" fill="#2C3E50">An absent, Init, or unknown mode is a non-authorizing rejection. Different bytes at an occupied position are a conflict.</text>
<text x="84" y="1128" class="r" font-size="25" fill="#2C3E50">A security cut or expiry creates no remote restrictive effect.</text>
</svg>
