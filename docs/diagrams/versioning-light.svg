<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="993" viewBox="0 0 1600 993" role="img" aria-labelledby="versioning-title versioning-desc">
<title id="versioning-title">NCP identity domains and native session gate</title>
<desc id="versioning-desc">Package, wire, stable-core, complete-contract, compact-proto, and release identities are separate. A native session needs a canonical same-major wire and the exact stable core. Other identities are evidence only. Candidate of the UNRELEASED 1.0 line. It is not release or certification evidence.</desc>
