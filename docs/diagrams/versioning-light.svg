<text x="1396.7" y="43.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">CANDIDATE WIRE 1.0</text>
<text x="52" y="46" class="s" font-size="24" fill="#4D5C64" font-weight="700" letter-spacing="2">IDENTITY</text>
<text x="52" y="114" class="s" font-size="38" fill="#1F3F60" font-weight="700">Separate identities, and two checks open a native session</text>
<text x="78" y="216" class="s" font-size="28" fill="#2C3E50" font-weight="700">Identity domains</text>
<text x="78" y="274" class="r" font-size="25" fill="#2C3E50">Package version: 1.0.0-rc.1.</text>
<text x="78" y="307" class="r" font-size="25" fill="#2C3E50">Wire version: 1.0. Canonical 1 means 1.0.</text>
<text x="78" y="340" class="r" font-size="25" fill="#2C3E50">Stable-core digest: proposed and not yet allocated.</text>
<text x="78" y="373" class="r" font-size="25" fill="#2C3E50">Complete contract digest: SHA-256 over the normative</text>
<text x="78" y="406" class="r" font-size="25" fill="#2C3E50">sources.</text>
<text x="78" y="439" class="r" font-size="25" fill="#2C3E50">Compact proto hash: 163acc57d8a62b66, advisory only.</text>
<text x="78" y="472" class="r" font-size="25" fill="#2C3E50">Release tag: none for 1.0. The latest is v0.8.0 on wire 0.8.</text>
<text x="78" y="505" class="r" font-size="25" fill="#2C3E50">The gate reads only the wire version and the stable core.</text>
<text x="880" y="215.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">1</text>
<text x="912" y="216" class="s" font-size="28" fill="#2C3E50" font-weight="700">Canonical same-major wire</text>
<text x="868" y="274" class="r" font-size="25" fill="#2C3E50">Accept 1 or 1.&lt;minor&gt; in canonical spelling.</text>
<text x="880" y="375.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">2</text>
<text x="912" y="376" class="s" font-size="28" fill="#2C3E50" font-weight="700">Exact stable core</text>
<text x="868" y="434" class="r" font-size="25" fill="#2C3E50">Compare the prepared stable-core identity exactly.</text>
<text x="868" y="677" class="s" font-size="28" fill="#2C3E50" font-weight="700">Native session may</text>
<text x="868" y="709" class="s" font-size="28" fill="#2C3E50" font-weight="700">open</text>
<text x="868" y="767" class="r" font-size="25" fill="#2C3E50">Both checks pass.</text>
<text x="1241" y="677" class="s" font-size="28" fill="#2C3E50" font-weight="700">Reject</text>
<text x="1241" y="767" class="r" font-size="25" fill="#2C3E50">Either check fails. No</text>
<text x="1241" y="800" class="r" font-size="25" fill="#2C3E50">native session exists.</text>
<text x="990.5" y="508" class="s" font-size="24" fill="#4D5C64" font-weight="600" text-anchor="end">both pass</text>
<text x="1363.5" y="508" class="s" font-size="24" fill="#4D5C64" font-weight="600" text-anchor="end">either fails</text>
<text x="84" y="894" class="s" font-size="24" fill="#4D5C64" font-weight="600">WIRE 0.8</text>
<text x="84" y="932" class="r" font-size="25" fill="#2C3E50">Wire 0.8 and wire 1.0 are different protocols. Only a terminating gateway joins them, and it reports no native match.</text>
</svg>
