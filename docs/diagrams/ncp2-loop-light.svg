<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1029" viewBox="0 0 1600 1029" role="img" aria-labelledby="ncp2-loop-title ncp2-loop-desc">
<title id="ncp2-loop-title">Neural networks fly simulated drones over NCP 2</title>
<desc id="ncp2-loop-desc">A loop host runs NEST network controllers and CREBAIN worlds, each with its own NCP 2 session. Networks flew five drones in two worlds to within 2.6 cm of their targets, and the check confirmed all 2,400 controller responses. NCP 2 is UNRELEASED. It is not release or certification evidence.</desc>
