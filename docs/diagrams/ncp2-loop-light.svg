<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1059" viewBox="0 0 1600 1059" role="img" aria-labelledby="ncp2-loop-title ncp2-loop-desc">
<title id="ncp2-loop-title">Spiking controllers in NEST fly simulated drones over NCP 2</title>
<desc id="ncp2-loop-desc">A loop host runs spiking controllers in NEST and CREBAIN worlds, each with its own NCP 2 session. Three controllers flew five drones in two worlds to within 2.6 cm of their targets, and the check confirmed all 2,400 controller responses. NCP 2 is UNRELEASED. It is not release or certification evidence.</desc>
