<text x="52" y="46" class="s" font-size="24" fill="#4D5C64" font-weight="700" letter-spacing="2">NCP 2 CLOSED LOOP</text>
<text x="52" y="114" class="s" font-size="38" fill="#1F3F60" font-weight="700">Neural networks fly simulated drones, step by step</text>
<text x="78" y="216" class="s" font-size="28" fill="#2C3E50" font-weight="700">Controllers</text>
<text x="78" y="248" class="s" font-size="25" fill="#1F6968" font-weight="600">NEST networks</text>
<text x="78" y="306" class="r" font-size="25" fill="#2C3E50">N programs, one session</text>
<text x="78" y="339" class="r" font-size="25" fill="#2C3E50">each. Each receives the</text>
<text x="78" y="372" class="r" font-size="25" fill="#2C3E50">latest estimate of its</text>
<text x="78" y="405" class="r" font-size="25" fill="#2C3E50">drones and proposes their</text>
<text x="78" y="438" class="r" font-size="25" fill="#2C3E50">accelerations.</text>
<text x="653.3" y="216" class="s" font-size="28" fill="#2C3E50" font-weight="700">Loop host</text>
<text x="653.3" y="248" class="s" font-size="25" fill="#1F6968" font-weight="600">crebain-ncp-loop</text>
<text x="653.3" y="306" class="r" font-size="25" fill="#2C3E50">First all controllers, at the</text>
<text x="653.3" y="339" class="r" font-size="25" fill="#2C3E50">same time, then all</text>
<text x="653.3" y="372" class="r" font-size="25" fill="#2C3E50">worlds. One transcript for</text>
<text x="653.3" y="405" class="r" font-size="25" fill="#2C3E50">each session.</text>
<text x="1228.7" y="216" class="s" font-size="28" fill="#2C3E50" font-weight="700">Worlds</text>
<text x="1228.7" y="248" class="s" font-size="25" fill="#1F6968" font-weight="600">CREBAIN simulator</text>
<text x="1228.7" y="306" class="r" font-size="25" fill="#2C3E50">K programs with 1 to 3</text>
<text x="1228.7" y="339" class="r" font-size="25" fill="#2C3E50">drones each. A world</text>
<text x="1228.7" y="372" class="r" font-size="25" fill="#2C3E50">refuses actions computed</text>
<text x="1228.7" y="405" class="r" font-size="25" fill="#2C3E50">from another state.</text>
<text x="413.3" y="193.2" class="s" font-size="24" fill="#4D5C64" font-weight="600">estimate,</text>
<text x="413.3" y="221.2" class="s" font-size="24" fill="#4D5C64" font-weight="600">state digest</text>
<text x="413.3" y="416.9" class="s" font-size="24" fill="#4D5C64" font-weight="600">accelerations,</text>
<text x="413.3" y="444.9" class="s" font-size="24" fill="#4D5C64" font-weight="600">response</text>
<text x="988.7" y="193.2" class="s" font-size="24" fill="#4D5C64" font-weight="600">estimate,</text>
<text x="988.7" y="221.2" class="s" font-size="24" fill="#4D5C64" font-weight="600">state digest</text>
<text x="988.7" y="416.9" class="s" font-size="24" fill="#4D5C64" font-weight="600">accelerations,</text>
<text x="988.7" y="444.9" class="s" font-size="24" fill="#4D5C64" font-weight="600">identities</text>
<text x="90" y="579.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">1</text>
<text x="122" y="580" class="s" font-size="28" fill="#2C3E50" font-weight="700">Drones reach their targets</text>
<text x="78" y="638" class="r" font-size="25" fill="#2C3E50">One network flew one drone, and</text>
<text x="78" y="671" class="r" font-size="25" fill="#2C3E50">three networks flew five drones in two</text>
<text x="78" y="704" class="r" font-size="25" fill="#2C3E50">worlds. Each drone started 7.3 to</text>
<text x="78" y="737" class="r" font-size="25" fill="#2C3E50">15.6 m from its target and ended</text>
<text x="78" y="770" class="r" font-size="25" fill="#2C3E50">within 2.6 cm, after 600 steps of</text>
<text x="78" y="803" class="r" font-size="25" fill="#2C3E50">20 ms.</text>
<text x="599.3" y="579.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">2</text>
<text x="631.3" y="580" class="s" font-size="28" fill="#2C3E50" font-weight="700">Every action checked</text>
<text x="587.3" y="638" class="r" font-size="25" fill="#2C3E50">The offline check confirmed all 2,400</text>
<text x="587.3" y="671" class="r" font-size="25" fill="#2C3E50">controller responses: each applied</text>
<text x="587.3" y="704" class="r" font-size="25" fill="#2C3E50">once, from the state it answered, to</text>
<text x="587.3" y="737" class="r" font-size="25" fill="#2C3E50">the drones it named.</text>
<text x="1108.7" y="579.5" class="s" font-size="24" fill="#F7F3E9" font-weight="700" letter-spacing="1" text-anchor="middle">3</text>
<text x="1140.7" y="580" class="s" font-size="28" fill="#2C3E50" font-weight="700">The same again</text>
<text x="1096.7" y="638" class="r" font-size="25" fill="#2C3E50">A second run gave the same results,</text>
<text x="1096.7" y="671" class="r" font-size="25" fill="#2C3E50">final states included. NEST ran on</text>
<text x="1096.7" y="704" class="r" font-size="25" fill="#2C3E50">one thread with a fixed seed.</text>
<text x="84" y="897" class="s" font-size="24" fill="#4D5C64" font-weight="600">LIMITS</text>
<text x="84" y="935" class="r" font-size="25" fill="#2C3E50">Simulated drones and a minimal spiking controller of integrate-and-fire populations, run with NEST 3.10 on one laptop on</text>
<text x="84" y="968" class="r" font-size="25" fill="#2C3E50">12 November 2026. No physical drone, safety, or real-time claim; an Engram network can implement the same controller contract.</text>
</svg>
