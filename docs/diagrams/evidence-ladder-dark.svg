<text x="52" y="46" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">EVIDENCE CLASSES</text>
<text x="52" y="114" class="s" font-size="38" fill="#8DB2D8" font-weight="700">Each claim needs evidence of its own class</text>
<text x="90" y="215.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">5</text>
<text x="122" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Release</text>
<text x="78" y="274" class="r" font-size="25" fill="#ECE5D5">Immutable tag, signed artifacts, and provenance.</text>
<text x="78" y="307" class="r" font-size="25" fill="#ECE5D5">No 1.0 release exists. The latest release is v0.8.0 on wire 0.8.</text>
<text x="1468.3" y="213.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">NONE</text>
<text x="90" y="404.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">4</text>
<text x="122" y="405" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Independent and external qualification</text>
<text x="78" y="463" class="r" font-size="25" fill="#ECE5D5">Live security, independent peers, faults, soak, performance, and supply chain.</text>
<text x="78" y="496" class="r" font-size="25" fill="#ECE5D5">All ten external release gates of the 1.0 candidate are NOT RUN.</text>
<text x="1446.8" y="402.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">NOT RUN</text>
<text x="90" y="593.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">3</text>
<text x="122" y="594" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Installed native observation</text>
<text x="78" y="652" class="r" font-size="25" fill="#ECE5D5">A dated campaign with exact artifacts, configuration, and retained failures.</text>
<text x="78" y="685" class="r" font-size="25" fill="#ECE5D5">Permits the observed configuration and workload only.</text>
<text x="1389.3" y="591.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">SELECTED CASES</text>
<text x="90" y="782.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">2</text>
<text x="122" y="783" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Complete local gate</text>
<text x="78" y="841" class="r" font-size="25" fill="#ECE5D5">One run of scripts/check.sh on one fixed source cut.</text>
<text x="78" y="874" class="r" font-size="25" fill="#ECE5D5">Permits local regression evidence for that cut only.</text>
<text x="1461.2" y="780.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">LOCAL</text>
<text x="90" y="971.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">1</text>
<text x="122" y="972" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Source controls</text>
<text x="78" y="1030" class="r" font-size="25" fill="#ECE5D5">Unit, property, and cross-language tests on named sources.</text>
<text x="78" y="1063" class="r" font-size="25" fill="#ECE5D5">Permits the tested behavior of that source only.</text>
<text x="1475.2" y="969.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">IN CI</text>
<text x="84" y="1157" class="s" font-size="24" fill="#AAB7BE" font-weight="600">RULE</text>
<text x="84" y="1195" class="r" font-size="25" fill="#ECE5D5">A lower class never promotes a claim to a higher class. Protocol success does not establish physical safety, controller stability, or</text>
<text x="84" y="1228" class="r" font-size="25" fill="#ECE5D5">scientific validity.</text>
</svg>
