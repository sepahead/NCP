<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1289" viewBox="0 0 1600 1289" role="img" aria-labelledby="evidence-ladder-title evidence-ladder-desc">
<title id="evidence-ladder-title">NCP evidence classes and permitted claims</title>
<desc id="evidence-ladder-desc">Five evidence classes run from source controls to release. Each class permits only its own claim. The NCP 1.0 candidate has local and selected native evidence. Its independent and external gates are NOT RUN, and it is UNRELEASED. It is not release or certification evidence.</desc>
