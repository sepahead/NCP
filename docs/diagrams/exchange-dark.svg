<text x="52" y="46" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">MODULAR EXCHANGE</text>
<text x="52" y="114" class="s" font-size="38" fill="#8DB2D8" font-weight="700">One request, one retained outcome, one acknowledgement</text>
<text x="78" y="212" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Client</text>
<text x="78" y="244" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Caller with one</text>
<text x="78" y="274" class="s" font-size="25" fill="#6FC1BD" font-weight="600">pending slot</text>
<text x="926" y="212" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Owner</text>
<text x="926" y="244" class="s" font-size="25" fill="#6FC1BD" font-weight="600">Closed application owner</text>
<text x="938" y="363.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">1</text>
<text x="970" y="364" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Exact duplicate</text>
<text x="926" y="422" class="r" font-size="25" fill="#ECE5D5">Return the retained bytes. Do not execute again.</text>
<text x="938" y="517.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">2</text>
<text x="970" y="518" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Pure admission</text>
<text x="926" y="576" class="r" font-size="25" fill="#ECE5D5">A rejection leaves the sequence number unused and</text>
<text x="926" y="609" class="r" font-size="25" fill="#ECE5D5">state unchanged.</text>
<text x="938" y="704.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">3</text>
<text x="970" y="705" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Reserve</text>
<text x="926" y="763" class="r" font-size="25" fill="#ECE5D5">Resolve inputs and allocate outputs before the</text>
<text x="926" y="796" class="r" font-size="25" fill="#ECE5D5">sequence number is consumed.</text>
<text x="938" y="891.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">4</text>
<text x="970" y="892" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Execute once</text>
<text x="926" y="950" class="r" font-size="25" fill="#ECE5D5">Consume the sequence number. A later failure retires</text>
<text x="926" y="983" class="r" font-size="25" fill="#ECE5D5">the generation.</text>
<text x="938" y="1078.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">5</text>
<text x="970" y="1079" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Retain outcome</text>
<text x="926" y="1137" class="r" font-size="25" fill="#ECE5D5">Keep the result frame until its exact</text>
<text x="926" y="1170" class="r" font-size="25" fill="#ECE5D5">acknowledgement.</text>
<text x="938" y="1265.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">6</text>
<text x="970" y="1266" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Release frame</text>
<text x="926" y="1324" class="r" font-size="25" fill="#ECE5D5">The acknowledgement frees the result frame, not the</text>
<text x="926" y="1357" class="r" font-size="25" fill="#ECE5D5">buffers.</text>
<text x="540.5" y="338" class="s" font-size="25" fill="#ECE5D5" font-weight="600" text-anchor="middle">request: binding, sequence, operation, digest</text>
<text x="540.5" y="1053" class="s" font-size="25" fill="#ECE5D5" font-weight="600" text-anchor="middle">retained outcome</text>
<text x="540.5" y="1240" class="s" font-size="25" fill="#ECE5D5" font-weight="600" text-anchor="middle">acknowledge with the outcome digest</text>
<text x="540.5" y="1407" class="s" font-size="25" fill="#ECE5D5" font-weight="600" text-anchor="middle">next request names that outcome as predecessor</text>
<text x="84" y="1509" class="s" font-size="24" fill="#AAB7BE" font-weight="600">UNCERTAIN DISPATCH</text>
<text x="84" y="1547" class="r" font-size="25" fill="#ECE5D5">A lost response or acknowledgement keeps the pending evidence. The client stops that channel. It never retries or reconnects on</text>
<text x="84" y="1580" class="r" font-size="25" fill="#ECE5D5">its own. A query can read the original retained bytes by sequence and request digest.</text>
</svg>
