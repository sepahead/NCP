<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1641" viewBox="0 0 1600 1641" role="img" aria-labelledby="exchange-title exchange-desc">
<title id="exchange-title">NCP modular request and outcome exchange</title>
<desc id="exchange-desc">A client sends one exact request. The owner returns retained bytes for an exact duplicate, admits new work without side effects, reserves storage, executes once, and retains the outcome until an exact acknowledgement. The local SDK 1.0.0 is released; applications and wire 1.0 remain UNRELEASED. It is not release or certification evidence.</desc>
