<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1600" height="1083" viewBox="0 0 1600 1083" role="img" aria-labelledby="ncp2-transcript-title ncp2-transcript-desc">
<title id="ncp2-transcript-title">An NCP 2 transcript and its hash chain</title>
<desc id="ncp2-transcript-desc">A program records each frame before it sends it. Requests and responses name each other by digest, so a session forms one hash chain that a verifier checks. A transcript does not show who produced the frames. NCP 2 is UNRELEASED. It is not release or certification evidence.</desc>
