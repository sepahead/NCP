<text x="52" y="46" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">NCP 2 TRANSCRIPT</text>
<text x="52" y="114" class="s" font-size="38" fill="#8DB2D8" font-weight="700">Every session can be checked afterwards</text>
<text x="90" y="215.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">1</text>
<text x="122" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Record first</text>
<text x="78" y="274" class="r" font-size="25" fill="#ECE5D5">The program writes each frame to its</text>
<text x="78" y="307" class="r" font-size="25" fill="#ECE5D5">transcript before it sends it, and each</text>
<text x="78" y="340" class="r" font-size="25" fill="#ECE5D5">received frame once it has arrived</text>
<text x="78" y="373" class="r" font-size="25" fill="#ECE5D5">whole.</text>
<text x="599.3" y="215.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">2</text>
<text x="631.3" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">One chain</text>
<text x="587.3" y="274" class="r" font-size="25" fill="#ECE5D5">Each request names the response</text>
<text x="587.3" y="307" class="r" font-size="25" fill="#ECE5D5">before it, and each response names its</text>
<text x="587.3" y="340" class="r" font-size="25" fill="#ECE5D5">request, by their digests.</text>
<text x="1108.7" y="215.5" class="s" font-size="24" fill="#10202B" font-weight="700" letter-spacing="1" text-anchor="middle">3</text>
<text x="1140.7" y="216" class="s" font-size="28" fill="#ECE5D5" font-weight="700">Check afterwards</text>
<text x="1096.7" y="274" class="r" font-size="25" fill="#ECE5D5">A verifier recomputes every digest and</text>
<text x="1096.7" y="307" class="r" font-size="25" fill="#ECE5D5">checks the numbers, the</text>
<text x="1096.7" y="340" class="r" font-size="25" fill="#ECE5D5">acknowledgements, and the chain over</text>
<text x="1096.7" y="373" class="r" font-size="25" fill="#ECE5D5">the records. A changed, removed, or</text>
<text x="1096.7" y="406" class="r" font-size="25" fill="#ECE5D5">reordered record breaks it.</text>
<text x="52" y="508" class="s" font-size="24" fill="#AAB7BE" font-weight="700" letter-spacing="2">THE FRAMES OF ONE SESSION, IN ORDER</text>
<text x="197" y="580" class="s" font-size="24" fill="#AAB7BE" font-weight="600" text-anchor="middle">request 0</text>
<text x="197" y="618" class="s" font-size="26" fill="#ECE5D5" font-weight="700" text-anchor="middle">open</text>
<text x="599" y="580" class="s" font-size="24" fill="#AAB7BE" font-weight="600" text-anchor="middle">response 0</text>
<text x="599" y="618" class="s" font-size="26" fill="#ECE5D5" font-weight="700" text-anchor="middle">ok</text>
<text x="1001" y="580" class="s" font-size="24" fill="#AAB7BE" font-weight="600" text-anchor="middle">request 1</text>
<text x="1001" y="618" class="s" font-size="26" fill="#ECE5D5" font-weight="700" text-anchor="middle">step</text>
<text x="1403" y="580" class="s" font-size="24" fill="#AAB7BE" font-weight="600" text-anchor="middle">response 1</text>
<text x="1403" y="618" class="s" font-size="26" fill="#ECE5D5" font-weight="700" text-anchor="middle">ok</text>
<text x="197" y="768" class="s" font-size="24" fill="#AAB7BE" font-weight="600" text-anchor="middle">request 2</text>
<text x="197" y="806" class="s" font-size="26" fill="#ECE5D5" font-weight="700" text-anchor="middle">step</text>
<text x="599" y="768" class="s" font-size="24" fill="#AAB7BE" font-weight="600" text-anchor="middle">response 2</text>
<text x="599" y="806" class="s" font-size="26" fill="#ECE5D5" font-weight="700" text-anchor="middle">ok</text>
<text x="1001" y="768" class="s" font-size="24" fill="#AAB7BE" font-weight="600" text-anchor="middle">request 3</text>
<text x="1001" y="806" class="s" font-size="26" fill="#ECE5D5" font-weight="700" text-anchor="middle">close</text>
<text x="1403" y="768" class="s" font-size="24" fill="#AAB7BE" font-weight="600" text-anchor="middle">response 3</text>
<text x="1403" y="806" class="s" font-size="26" fill="#ECE5D5" font-weight="700" text-anchor="middle">ok</text>
<text x="84" y="918" class="s" font-size="24" fill="#AAB7BE" font-weight="600">WHAT A TRANSCRIPT SHOWS</text>
<text x="84" y="956" class="r" font-size="25" fill="#ECE5D5">Which frames one program sent and received, in which order. Because a frame is recorded before it is sent, the transcript holds</text>
<text x="84" y="989" class="r" font-size="25" fill="#ECE5D5">every request that the peer may have run. It does not show who produced the frames: transcripts are not signed. With a key, the</text>
<text x="84" y="1022" class="r" font-size="25" fill="#ECE5D5">chain shows that a holder of the key wrote them. CREBAIN's loop check and Prisoma's capture read transcripts.</text>
</svg>
