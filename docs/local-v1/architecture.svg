<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">NCP development-reference ownership</title>
<desc id="desc">This bounded development example has Engram coordinate four native owners through separate private NCP request and result pipes. Neural and body owners mutate their own state. Capture and monitoring cannot command. This example does not define the complete final product scope.</desc>
