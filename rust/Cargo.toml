[package]
name = "sepahead-ncp-core"
version = "2.0.0-alpha.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "NCP 2: exactly-once exchanges and hash-chained streams between independent programs"
repository = "https://github.com/sepahead/NCP"
publish = false

[lib]
name = "ncp"

[dependencies]
serde = "=1.0.229"
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.11.1"
socket2 = "=0.6.5"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }

[[example]]
name = "echo_owner"

[[example]]
name = "bench_client"

[[example]]
name = "model_owner"

[[example]]
name = "decode_corpus"

[workspace]
