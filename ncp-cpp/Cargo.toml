[package]
name = "ncp-cpp"
description = "C ABI for the informative NCP Rust reference: version guards, keys, codecs, safety helpers, and validation."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ncp-cpp"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "ncp_cpp"
# staticlib (link into a C++ binary) + cdylib (dlopen / -lncp_cpp).
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
ncp-core = { workspace = true }
serde_json = { workspace = true }
