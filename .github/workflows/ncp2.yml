name: NCP 2

# The gate of NCP 2 (scripts/check_ncp2.sh): the Python and Rust SDKs, the shared vectors, the
# model conformance of both owners, the Lean proofs of the owner model with their axiom audit, the
# owners against the compiled Lean model, and differential fuzzing of the decoders.
on:
  push:
    paths:
      - "python/**"
      - "rust/**"
      - "model/**"
      - "conformance/vectors.json"
      - "conformance/generate.py"
      - "conformance/fuzz.py"
      - "spec/NCP-2.md"
      - "formal/**"
      - "scripts/check_ncp2.sh"
      - ".github/workflows/ncp2.yml"
  pull_request:
    paths:
      - "python/**"
      - "rust/**"
      - "model/**"
      - "conformance/vectors.json"
      - "conformance/generate.py"
      - "conformance/fuzz.py"
      - "spec/NCP-2.md"
      - "formal/**"
      - "scripts/check_ncp2.sh"
      - ".github/workflows/ncp2.yml"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}, Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported versions: Python 3.11 and the crate's rust-version.
          - { os: ubuntu-latest, python: "3.11", rust: "1.88.0", numpy: false, lean: false }
          - { os: ubuntu-latest, python: "3.15", rust: stable, numpy: true, lean: true }
          - { os: macos-latest, python: "3.15", rust: stable, numpy: false, lean: false }
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned 2026-07-10
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Install numpy for the array tests
        if: matrix.numpy
        run: python -m pip install --disable-pip-version-check numpy==2.5.4

      - name: Install elan, which installs the Lean version in formal/lean-toolchain
        if: matrix.lean
        run: |
          # elan v4.2.4 (commit 227caca); downloaded to a file so that a failed download stops the step
          curl -sSfL -o "$RUNNER_TEMP/elan-init.sh" \
            https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: NCP 2 gate
        env:
          PYTHON: python
          NCP2_SKIP_LEAN: ${{ matrix.lean && '0' || '1' }}
        run: scripts/check_ncp2.sh
