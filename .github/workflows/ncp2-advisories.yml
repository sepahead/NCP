name: NCP 2 advisories

# The advisory gate of NCP 2 (scripts/check_ncp2_advisories.sh): cargo-deny checks the lockfiles of
# the Rust core crate and of the Rust Zenoh binding against the current RustSec database, with the
# policies scripts/ncp2-deny-core.toml and scripts/ncp2-deny-zenoh.toml. It runs on each change of a
# lockfile or a policy, and every Monday, because a new advisory can apply to a lockfile that did
# not change.
on:
  push:
    paths:
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "bindings/zenoh/rust/Cargo.toml"
      - "bindings/zenoh/rust/Cargo.lock"
      - "scripts/ncp2-deny-core.toml"
      - "scripts/ncp2-deny-zenoh.toml"
      - "scripts/check_ncp2_advisories.sh"
      - ".github/workflows/ncp2-advisories.yml"
  pull_request:
    paths:
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "bindings/zenoh/rust/Cargo.toml"
      - "bindings/zenoh/rust/Cargo.lock"
      - "scripts/ncp2-deny-core.toml"
      - "scripts/ncp2-deny-zenoh.toml"
      - "scripts/check_ncp2_advisories.sh"
      - ".github/workflows/ncp2-advisories.yml"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  advisories:
    name: current RustSec database
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_DENY_VERSION: "0.19.9"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned 2026-07-10
        with:
          toolchain: "1.88.0"

      - name: Install cargo-deny
        run: |
          cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
          test "$(cargo deny --version)" = "cargo-deny $CARGO_DENY_VERSION"

      - name: NCP 2 advisory gate
        run: scripts/check_ncp2_advisories.sh
